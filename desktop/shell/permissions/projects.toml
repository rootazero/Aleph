# Tauri permission set for the shell's two project-picker commands.
# `tauri-build` reads this at compile time and exposes the identifiers
# below to `capabilities/default.json`. Without an explicit permission
# Tauri refuses to let the remote Panel origin invoke our commands.

[[permission]]
identifier = "allow-pick-project-directory"
description = "Allow the Panel to open the native folder picker via `pick_project_directory`."
commands.allow = ["pick_project_directory"]

[[permission]]
identifier = "allow-create-project-directory"
description = "Allow the Panel to mkdir a fresh project folder via `create_project_directory`."
commands.allow = ["create_project_directory"]
