[package]
name = "aleph-desktop-shell"
description = "Aleph desktop shell — a thin Tauri v2 native host (window, tray, lifecycle) for the Aleph Panel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "aleph-desktop-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.5"

# Panel webview microphone grant (voice-input button). Versions pinned to what
# wry 0.54 already resolves so the platform-webview handle types unify.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.38.2"
