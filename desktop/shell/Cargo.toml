[package]
name = "aleph-desktop-shell"
description = "Aleph desktop shell — a thin Tauri v2 native host (window, tray, lifecycle) for the Aleph Panel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["development-tools"]
keywords = ["aleph", "desktop", "shell", "tauri"]
readme = "README.md"

[[bin]]
name = "aleph-desktop-shell"
path = "src/main.rs"

[features]
default = ["embedded-core"]
# Bundles + supervises the local aleph-server daemon (full app variant).
# Build the panel-only shell with --no-default-features.
embedded-core = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
x509-parser = { workspace = true }
serde = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }
# Same TLS stack as shared/client + interfaces/cli (native-tls) — without a TLS
# feature `connect_async("wss://…")` fails outright, which used to kill desktop
# notifications for every remote https Gateway.
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
url = "2"
# LAN discovery for the panel-only variant's first-run connect page. Used only
# under `--no-default-features`; the full app compiles it but never browses.
mdns-sd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.5"

# Self-signed TLS trust hook for the Panel WKWebView (cert_trust::adapter_macos).
# objc2 stack pinned to EXACTLY what wry 0.55 resolves so the injected challenge
# handler's types unify with wry's WKNavigationDelegate — a second, incompatible
# objc2 stack would not compile. security-framework/core-foundation give safe
# SecTrust/SecCertificate DER extraction; both already resolve in the workspace lock.
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
block2 = "=0.6.2"
core-foundation = "0.10"
security-framework = "3"

# Panel webview microphone grant (voice-input button). Versions pinned to what
# wry 0.54 already resolves so the platform-webview handle types unify.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.38.2"
# `PWSTR` + the `Interface::cast` trait for the cert_trust::adapter_windows
# WebView2 hook. Version tracks webview2-com 0.38.2's own `windows`/`windows-core`
# 0.61 pin so the COM interface + string types unify (already in the workspace lock).
windows-core = "0.61"

[dev-dependencies]
# Not in [workspace.dependencies] (only a root [dependencies] entry there);
# pinned to match the version root/gateway/tls.rs already resolves.
rcgen = "0.13"
# external_link tests share a process-global REMOTE_ORIGIN static; serialise
# them so parallel test threads don't see each other's writes.
serial_test = "3.0"
