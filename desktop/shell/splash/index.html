<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aleph</title>
    <style>
      /* Native-feeling splash shown while the aleph-server daemon boots.
         Replaced by the live Panel as soon as the daemon is ready.

         Visual: monochrome wordmark over the window's vibrancy material —
         iOS 18 lock-screen idiom, no spinner, a subtle breathing bar for
         liveness. Keep transparent so the vibrancy backing layer shows. */
      :root {
        --fg: rgba(0, 0, 0, 0.86);
        --sub: rgba(0, 0, 0, 0.42);
        --bar-base: rgba(0, 0, 0, 0.14);
        --bar-peak: rgba(0, 0, 0, 0.42);
        --err: #c14a4a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: rgba(255, 255, 255, 0.92);
          --sub: rgba(255, 255, 255, 0.46);
          --bar-base: rgba(255, 255, 255, 0.14);
          --bar-peak: rgba(255, 255, 255, 0.5);
          --err: #ef7878;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Lift slightly above true centre — feels more deliberate than dead-centre. */
        transform: translateY(-12px);
      }
      .wordmark {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.06em;
        line-height: 1;
        /* Subtle fade-in on first paint so the splash doesn't feel static. */
        animation: settle 700ms ease-out both;
      }
      @keyframes settle {
        from {
          opacity: 0;
          transform: translateY(2px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .sub {
        margin-top: 10px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--sub);
        text-transform: lowercase;
      }
      /* Breathing progress bar — replaces the spinner. 80×2px, opacity-pulses
         so it reads as "alive" without grabbing attention. */
      .bar {
        margin-top: 24px;
        width: 80px;
        height: 2px;
        border-radius: 1px;
        background: var(--bar-base);
        position: relative;
        overflow: hidden;
      }
      .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--bar-peak);
        border-radius: 1px;
        animation: breathe 1.8s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.2;
          transform: scaleX(0.4);
        }
        50% {
          opacity: 1;
          transform: scaleX(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .wordmark {
          animation: none;
        }
        .bar::after {
          animation-duration: 4s;
        }
      }
      /* Error state — replaces the bar with a static line, recolours the
         wordmark to muted red so the message reads as a hard stop. */
      .err .wordmark {
        color: var(--err);
      }
      .err .bar::after {
        animation: none;
        opacity: 0.4;
        transform: scaleX(1);
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="wrap">
      <div class="wordmark" id="title">Aleph</div>
      <div class="sub" id="sub">starting your local assistant</div>
      <div class="bar" id="bar"><div></div></div>
    </div>
    <script>
      // The shell calls this via webview.eval() if the daemon fails to start.
      window.__alephError = function (msg) {
        document.getElementById("wrap").classList.add("err");
        document.getElementById("title").textContent = "Aleph could not start";
        document.getElementById("sub").textContent =
          msg || "the aleph-server daemon failed to start.";
      };
    </script>
  </body>
</html>
