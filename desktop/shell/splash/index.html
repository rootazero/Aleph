<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aleph</title>
    <style>
      /* Native-feeling splash shown while the aleph-server daemon boots.
         It is replaced by the live Panel as soon as the daemon is ready. */
      :root {
        --bg: #f4f3f7;
        --fg: #2a2533;
        --sub: #6b6577;
        --accent: #7a52c8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1622;
          --fg: #ece9f2;
          --sub: #9a93a8;
          --accent: #a98fe0;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap {
        text-align: center;
      }
      .ring {
        width: 46px;
        height: 46px;
        margin: 0 auto 20px;
        border: 3px solid color-mix(in srgb, var(--accent) 22%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ring {
          animation-duration: 2.4s;
        }
      }
      .title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .sub {
        margin-top: 6px;
        font-size: 12px;
        color: var(--sub);
      }
      .err .title {
        color: #d05a5a;
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="wrap">
      <div class="ring" id="ring"></div>
      <div class="title" id="title">Starting Aleph…</div>
      <div class="sub" id="sub">Bringing up your local assistant</div>
    </div>
    <script>
      // The shell calls this via webview.eval() if the daemon fails to start.
      window.__alephError = function (msg) {
        document.getElementById("ring").style.display = "none";
        document.getElementById("wrap").classList.add("err");
        document.getElementById("title").textContent =
          "Aleph could not start";
        document.getElementById("sub").textContent =
          msg || "The aleph-server daemon failed to start.";
      };
    </script>
  </body>
</html>
