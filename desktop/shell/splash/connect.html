<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connect Aleph</title>
<style>
  body { font: 14px -apple-system, system-ui, sans-serif; background:#0d0d10; color:#e8e8ea;
         display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
  /* macOS Overlay title-bar has no OS titlebar to grab. Provide a 30px top
     drag strip (mirrors the Panel's drag band) so the dialog is movable
     without blocking text selection or the controls below. Gated on the
     shell-injected data-platform (Win/Linux keep native chrome dragging). */
  .aleph-drag-strip { position:fixed; top:0; left:0; right:0; height:30px; }
  html[data-platform="macos"] .aleph-drag-strip { -webkit-app-region:drag; }
  .card { width:340px; padding:28px; background:#17171c; border-radius:14px; box-shadow:0 10px 40px #0008; }
  h1 { font-size:18px; margin:0 0 4px; }
  p { color:#9a9aa2; margin:0 0 18px; font-size:13px; }
  input { width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px;
          border:1px solid #2a2a32; background:#0d0d10; color:#e8e8ea; font-size:14px; }
  .row { display:flex; gap:8px; margin-top:14px; }
  button { flex:1; padding:10px; border:0; border-radius:8px; font-size:14px; cursor:pointer; }
  .primary { background:#4f46e5; color:#fff; }
  .ghost { background:#23232b; color:#cfcfd6; }
  .err { color:#ff6b6b; font-size:12px; margin-top:10px; min-height:14px; }
  /* mDNS discovery — only shown in the panel-only shell (see script). */
  .discover { margin-top:18px; display:none; }
  .discover.on { display:block; }
  .discover-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .discover-head span { color:#9a9aa2; font-size:12px; }
  .rescan { flex:0 0 auto; padding:4px 10px; font-size:12px; background:#23232b; color:#cfcfd6; }
  .found { list-style:none; margin:0; padding:0; }
  .found li { margin-top:6px; }
  .found button { width:100%; text-align:left; background:#1d1d24; color:#e8e8ea;
                  border:1px solid #2a2a32; font-size:13px; }
  .found button:hover { background:#23232b; }
  .muted { color:#6a6a72; font-size:12px; margin-top:6px; }
</style>
</head>
<body>
  <div class="aleph-drag-strip" data-tauri-drag-region=""></div>
  <div class="card">
    <h1>Connect to a Gateway</h1>
    <p>Enter a remote Aleph address (e.g. <code>192.168.1.5</code> or <code>https://gw.example.com</code>), or go back to the local daemon.</p>
    <input id="addr" placeholder="host, host:port, or http(s)://host" autofocus />
    <div class="row">
      <button class="primary" id="connect">Connect</button>
      <button class="ghost" id="local">Back to Local</button>
    </div>
    <div class="err" id="err"></div>

    <div class="discover" id="discover">
      <div class="discover-head">
        <span>Found on your network</span>
        <button class="rescan" id="rescan">Rescan</button>
      </div>
      <ul class="found" id="found"></ul>
      <div class="muted" id="discover-status"></div>
    </div>
  </div>
  <script>
    const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
    const err = (m) => { document.getElementById('err').textContent = m || ''; };

    // Which shell variant hosts this page. `is_lite_shell` is registered by
    // BOTH variants (the full app answers false), so the mode is resolved
    // deterministically at load — never inferred from whether a discovery
    // scan happened to succeed. It gates the mDNS section AND which connect
    // command submit() uses: the panel-only `connect_to` probes reachability
    // before persisting; the full app's `set_connection_target` hands an
    // unreachable target to its daemon supervisor instead. If the call itself
    // fails we stay in full-app behaviour — safe either way, because the lite
    // shell's re-route path is itself probe-gated.
    let liteMode = false;
    const modeReady = invoke('is_lite_shell')
      .then(v => { liteMode = !!v; })
      .catch(() => {});

    async function submit(raw) {
      err('');
      if (!raw) { err('Enter an address'); return; }
      await modeReady;
      try {
        // `connect_to` validates + probes reachability before persisting, so a
        // bad address stays on this page instead of navigating to a dead origin.
        await invoke(liteMode ? 'connect_to' : 'set_connection_target', { raw });
      } catch (e) {
        err(String(e));
      }
    }

    document.getElementById('connect').addEventListener('click', () => {
      submit(document.getElementById('addr').value.trim());
    });
    document.getElementById('local').addEventListener('click', async () => {
      err('');
      try { await invoke('clear_connection_target'); }
      catch (e) { err(String(e)); }
    });

    // prefill with the current target
    invoke('get_connection_target').then(t => {
      if (t && t !== 'local') document.getElementById('addr').value = t;
    }).catch(() => {});

    // Why the shell sent us here, carried in the fragment by
    // `connection::connect_page_url_with_error`. Read on load rather than
    // pushed by a post-navigate eval(): that eval runs against the outgoing
    // document, where `__alephError` does not exist yet, so the reason was
    // silently dropped and the page appeared with no explanation at all.
    {
      const m = new URLSearchParams(location.hash.slice(1)).get('err');
      if (m) err(m);
    }

    // Runtime push for an error raised while this page is already open.
    window.__alephError = (m) => err(m);

    // --- mDNS discovery (panel-only shell) ---------------------------------
    const discoverEl = document.getElementById('discover');
    const foundEl = document.getElementById('found');
    const statusEl = document.getElementById('discover-status');
    const rescanBtn = document.getElementById('rescan');

    function renderFound(list) {
      foundEl.innerHTML = '';
      if (!list || list.length === 0) {
        statusEl.textContent = 'No servers found — rescan or enter an address above.';
        return;
      }
      statusEl.textContent = '';
      for (const url of list) {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.textContent = url;
        b.addEventListener('click', () => {
          document.getElementById('addr').value = url;
          submit(url);
        });
        li.appendChild(b);
        foundEl.appendChild(li);
      }
    }

    async function scan() {
      statusEl.textContent = 'Scanning…';
      rescanBtn.disabled = true;
      try {
        renderFound(await invoke('discover_servers'));
      } catch (e) {
        // Discovery itself failed (mDNS unavailable, IPC error). Say so and
        // keep the section visible — silently hiding it would be
        // indistinguishable from "nothing on the network". Manual entry above
        // still works.
        foundEl.innerHTML = '';
        statusEl.textContent = 'Discovery failed — rescan or enter an address above.';
      } finally {
        rescanBtn.disabled = false;
      }
    }

    rescanBtn.addEventListener('click', scan);

    // The section exists only in the panel-only shell; the full app never
    // registers `discover_servers`, so it neither shows the section nor scans.
    modeReady.then(() => {
      if (liteMode) {
        discoverEl.classList.add('on');
        scan();
      }
    });
  </script>
</body>
</html>
