[package]
name = "aleph-desktop"
description = "Cross-platform desktop capabilities: screen capture, input automation, OCR"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["development-tools"]
keywords = ["aleph", "desktop", "automation", "ocr"]
readme = "README.md"

[dependencies]
# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Home directory resolution (for SwiftBridge default path)
dirs = { workspace = true }

# Desktop-bridge JSON-RPC schemas
aleph-protocol = { path = "../../shared/protocol" }

# Encoding
base64 = { workspace = true }

# Screen capture (xcap 0.8 requires image 0.25)
xcap = "0.8"
image = { workspace = true }

# Input automation
enigo = { version = "0.3", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
# setpgid on helper spawn so signals propagate when aleph-server exits.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_Threading",
    # OCR (WinRT Media.Ocr)
    "Media_Ocr",
    "Globalization",
    "Graphics_Imaging",
    "Storage_Streams",
    # Collections support (Lines(), Words() return IVectorView)
    "Foundation_Collections",
    "Foundation",
    # UI Automation (AX tree)
    "Win32_UI_Accessibility",
    "Win32_System_Com",
] }

# Clipboard read/write (Unicode text) — same crate already used by desktop/windows.
clipboard-win = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData", "NSURL", "NSProcessInfo"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace", "NSPasteboard"] }
core-graphics = "0.25"
core-foundation = "0.10"
objc2-screen-capture-kit = "0.3"
objc2-core-media = { version = "0.3", features = ["CMTime", "objc2"] }
objc2-core-foundation = { version = "0.3", features = ["objc2"] }
dispatch2 = "0.3"

[dev-dependencies]
tempfile = "3"
