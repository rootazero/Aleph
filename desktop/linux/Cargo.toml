[package]
name = "aleph-desktop-linux"
description = "Linux-native implementation of Aleph desktop capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["development-tools"]
keywords = ["aleph", "desktop", "linux", "automation"]
readme = "README.md"

[dependencies]
aleph-desktop = { path = "../shared" }
aleph-protocol = { path = "../../shared/protocol" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "process"] }
tracing = "0.1"
chrono = { workspace = true }
serde_json = { workspace = true }
# Camera-frame base64 encoding + JPEG dimension probing (workspace deps,
# already compiled for desktop/shared + desktop/macos — no new external crate).
base64 = { workspace = true }
image = { workspace = true }
