[package]
name = "aleph-desktop-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aleph-desktop = { path = "../shared" }
async-trait = "0.1"
tokio = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
base64 = { workspace = true }
image = { workspace = true }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString", "NSArray", "NSDictionary", "NSProcessInfo", "NSURL",
    "NSData", "NSEnumerator", "NSBundle", "NSLocale",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSImage",
    "NSEvent", "block2",
] }
objc2-user-notifications = { version = "0.3", features = [
    "UNUserNotificationCenter", "UNNotificationContent",
    "UNNotificationRequest", "UNNotificationSound",
    "UNNotificationSettings",
] }
block2 = "0.6"
objc2-av-foundation = { version = "0.3", features = [
    "AVCaptureDevice", "AVMediaFormat",
    "AVCaptureSession", "AVCaptureInput",
    "AVCapturePhotoOutput", "AVCaptureOutputBase",
    "AVCaptureFileOutput", "AVCaptureOutput",
] }
objc2-speech = { version = "0.3", features = [
    "SFSpeechRecognizer",
    "SFSpeechRecognitionRequest",
    "SFSpeechRecognitionResult",
    "SFSpeechRecognitionTask",
    "SFTranscription",
    "block2",
] }
core-foundation = "0.10"

[dev-dependencies]
# End-to-end test against the real compiled AlephBridge helper.
aleph-protocol = { path = "../../shared/protocol" }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros"] }
