[package]
name = "aleph-desktop-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aleph-desktop = { path = "../shared" }
aleph-protocol = { path = "../../shared/protocol" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "process"] }
chrono = { workspace = true }
serde_json = { workspace = true }
# Camera-frame base64 encoding + JPEG dimension probing (workspace deps,
# already compiled for desktop/shared + desktop/macos — no new external crate).
base64 = { workspace = true }
image = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Windows platform bindings
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_Globalization",
    "Win32_UI_Input_KeyboardAndMouse",
    # UI Automation (IUIAutomation) — the accessibility-tree backend that
    # lights up `desktop_som` / `desktop_ax_*` on Windows (parity with the
    # macOS Swift-bridge AX layer). COM is needed to instantiate CUIAutomation.
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Foundation",
    "UI_Notifications",
] }

# Clipboard operations
clipboard-win = "5"
