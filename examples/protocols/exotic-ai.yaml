# Example: Exotic AI — fully custom protocol with non-standard endpoints and response format
name: exotic-ai
base_url: https://api.exotic.ai

custom:
  auth:
    type: header
    header: X-Exotic-Key

  endpoints:
    chat: /v2/completions
    stream: /v2/completions/stream

  request_template:
    prompt: "{{prompt}}"
    max_tokens: 1024
    temperature: 0.7

  response_mapping:
    content: "$.output.generated_text"
    error: "$.error.message"

  stream_config:
    format: sse
    content_path: "$.chunk.text"
    done_marker: "[DONE]"
