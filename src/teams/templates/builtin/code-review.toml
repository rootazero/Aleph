# Multi-perspective code review team.
# Reviewer agents look at the diff through different lenses, then the lead
# synthesises a single review with severity-graded findings.

description = "Multi-perspective code review: security + perf + correctness + style → synthesis"
default_goal = "Review the diff or PR referenced in the team description"

[leader]
id = "lead-reviewer"
name = "Lead Reviewer"
role = "leader"
prompt_addendum = """
You synthesise the four parallel reviews into a single ranked findings list:
CRITICAL > HIGH > MEDIUM > LOW. Reject the diff if any CRITICAL finding stands.
"""

[[members]]
id = "security-reviewer"
name = "Security Reviewer"
role = "security"
prompt_addendum = "Look only for security defects: auth, injection, secrets, unsafe blocks."

[[members]]
id = "perf-reviewer"
name = "Performance Reviewer"
role = "performance"
prompt_addendum = "Look only for performance issues: N+1 queries, hot allocations, blocking I/O."

[[members]]
id = "correctness-reviewer"
name = "Correctness Reviewer"
role = "correctness"
prompt_addendum = "Look only for logic bugs, race conditions, edge-case handling, error propagation."

[[members]]
id = "style-reviewer"
name = "Style Reviewer"
role = "style"
prompt_addendum = "Look only for style/readability: naming, file size, abstraction smells."

[[tasks]]
key = "security_pass"
subject = "Security review of {goal}"
description = "Findings ranked by severity. Empty list is a valid result."
owner = "security-reviewer"
priority = "high"

[[tasks]]
key = "perf_pass"
subject = "Performance review of {goal}"
description = "Findings ranked by severity. Empty list is a valid result."
owner = "perf-reviewer"
priority = "normal"

[[tasks]]
key = "correctness_pass"
subject = "Correctness review of {goal}"
description = "Findings ranked by severity. Empty list is a valid result."
owner = "correctness-reviewer"
priority = "high"

[[tasks]]
key = "style_pass"
subject = "Style review of {goal}"
description = "Findings ranked by severity. Empty list is a valid result."
owner = "style-reviewer"
priority = "low"

[[tasks]]
key = "synthesis"
subject = "Synthesise review for {goal}"
description = """
Merge the four reviews. Output a single ranked findings list with one-line
justifications. Conclude with APPROVE / REQUEST CHANGES / REJECT.
"""
owner = "lead-reviewer"
priority = "critical"
depends_on = ["security_pass", "perf_pass", "correctness_pass", "style_pass"]
