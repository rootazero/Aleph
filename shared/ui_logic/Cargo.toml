[package]
name = "shared-ui-logic"
version = "0.1.0"
edition = "2021"
description = "Shared UI logic and SDK for Aleph clients"

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
futures = "0.3"
# Same 0.2 copy alephcore/tui/webchat already pin — `cargo tree -i unicode-width`
unicode-width = "0.2"

# Internal
aleph-protocol = { path = "../protocol" }

# WASM (for browser)
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "WebSocket",
    "MessageEvent",
    "ErrorEvent",
    "CloseEvent",
    "Window",
    "console",
    # Was reaching this crate's build only via feature unification with the
    # (now-removed) `leptos` dependency, which pulled it in transitively —
    # `wasm.rs`'s own direct use of `web_sys::BinaryType` needs it declared
    # here so the `wasm` feature keeps building standalone.
    "BinaryType"
] }

[features]
default = ["wasm"]
wasm = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys"
]