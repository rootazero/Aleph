[package]
name = "aleph-client"
version = "0.1.0"
edition = "2021"
description = "Aleph Gateway client library — WebSocket JSON-RPC 2.0"

# IMPORTANT: This crate MUST NOT depend on alephcore.
# It is a pure protocol client used by CLI, TUI, and any future client.

[dependencies]
aleph-protocol = { path = "../protocol" }
tokio = { version = "1.35", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
tracing = "0.1"
dirs = "6.0"

[dev-dependencies]
# `net` for the loopback WebSocket server the handshake test spins up.
tokio = { version = "1.35", features = ["net"] }
