<!doctype html>
<meta charset="utf-8">
<title>Phase11 isolated native credential fixture</title>
<p>Scoped credential effects only. Not the production Panel.</p>
<script>
"use strict";
/*SETTINGS*/
const bridge = window.__alephShellBridge;
const emit = (kind, fields = {}) => window.nsh.postMessage(JSON.stringify({
  nonce: settings.nonce, qa_run_id: settings.run_id, kind, ...fields
}));
// Same Probe handshake as the production Panel, with no business projection.
window.addEventListener("message", event => {
  if (event.source !== null || event.origin !== "" || typeof event.data !== "string") return;
  let request;
  try { request = JSON.parse(event.data); } catch (_) { return; }
  if (request.kind === "probe") bridge.reply(JSON.stringify({
    kind: "ready", request: request.request, document: bridge.document
  }));
});
const expected = {device_id: "phase11-isolated-fixture", device_token: "qa-only-synthetic-not-a-gateway-token"};
const invoke = (command, args) => bridge.invoke("panel_credential_" + command, args);
const equal = value => value?.device_id === expected.device_id && value?.device_token === expected.device_token;
const state = JSON.parse(sessionStorage.getItem("phase11-observations") || "null")
  || {steps: [], documents: []};
const check = (name, ok) => {
  state.steps.push({name, ok: ok === true});
  if (!ok) throw new Error("fixture assertion failed");
};
async function rejected(command, args) {
  try { await invoke(command, args); return false; } catch (_) { return true; }
}
(async () => {
  state.documents.push(bridge.document);
  if (location.pathname === "/") {
    const first = await invoke("load");
    check("initial_empty", first.credential === null);
    const ack = await invoke("save", {lease_id: first.lease_id, credential: expected});
    check("save_ack", ack === null);
    const second = await invoke("load");
    check("read_after_save", equal(second.credential));
    check("superseded_lease_rejected", await rejected("delete", {lease_id: first.lease_id}));
    const third = await invoke("load");
    check("read_after_stale", equal(third.credential));
    state.old_lease = third.lease_id;
    // Only lease identity/booleans survive navigation; never persist credentials in JS storage.
    sessionStorage.setItem("phase11-observations", JSON.stringify(state));
    location.assign("/after-navigation");
    return;
  }
  check("navigation_lease_rejected", await rejected("delete", {lease_id: state.old_lease}));
  const current = await invoke("load");
  check("read_after_navigation", equal(current.credential));
  bridge.reply(JSON.stringify({kind: "credential-request", request: 987654,
    document: "0".repeat(32), call: {operation: "delete", lease_id: current.lease_id}}));
  const afterWrongDocument = await invoke("load");
  check("wrong_document_no_effect", equal(afterWrongDocument.credential));
  check("delete_existed", await invoke("delete", {lease_id: afterWrongDocument.lease_id}));
  check("final_empty", (await invoke("load")).credential === null);
  sessionStorage.removeItem("phase11-observations");
  emit("credential-fixture", {documents: state.documents, steps: state.steps, cleanup: true});
  emit("close-requested");
})().catch(async () => {
  let cleanup = false;
  try {
    const lease = await invoke("load");
    await invoke("delete", {lease_id: lease.lease_id});
    cleanup = (await invoke("load")).credential === null;
  } catch (_) { /* Failure remains visible; never fall back to production storage. */ }
  emit("credential-fixture", {documents: state.documents, steps: state.steps, cleanup});
  emit("close-requested");
});
</script>
