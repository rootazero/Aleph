<!doctype html>
<html><head><title>Aleph dual-engine QA</title></head>
<body>
  <h1>__MARKER__</h1>
  <!-- Two clickables on purpose. The LINK is inline, and on obscura v0.2.2 an
       inline element reports a zero box from DOM.getBoxModel,
       DOM.getContentQuads AND getBoundingClientRect() alike (measured
       2026-09-19 against the binary this fixture launches) — so it cannot be
       clicked AT ALL: not by coordinates, and not by ref either, because
       OCCLUSION_JS hit-tests the resolved element and refuses a zero-sized box
       whichever route reached it. `drive.py`'s stage_click asserts that
       refusal. The DIV is block-level and has a real box (8,30 220x44 on the
       same run), which is what BOTH halves of the `click` stage aim at.
       Asserting both is what stops "click works" from meaning "one of the two
       worked". -->
  <a id="lnk" href="/second.html">go by ref</a>
  <div id="blk" style="display:block;width:220px;height:44px;background:#eee;cursor:pointer"
       onclick="location.href='/second.html'">go by coordinates</div>
  <span id="ghost" style="opacity:0">__MARKER__-ghost</span>
  <div id="nope" style="display:none">__MARKER__-hidden</div>

  <!-- ==================================================================
       The `switch` stage's cross-engine ref comparison (spec F2) reads the
       block below on obscura and again on chromium. Everything above this
       comment is load-bearing for the `open` / `snapshot` / `click` stages,
       which is why this is APPENDED rather than woven in: `#blk`'s box (8,30
       220x44, measured) is what stage_click's coordinate half aims at, and an
       element inserted before it would move it.

       Chosen for ACCESSIBLE-NAME diversity, because a name is what an agent
       addresses an element by, and the name is where two DOM readings actually
       diverge. One element per naming route:
         * <button>            — name from CONTENT (accname rule 8)
         * <label for> + input — name from a LABEL ELEMENT, resolved by id
         * aria-label          — name from an ATTRIBUTE, overriding content
         * <img alt>           — name from `alt` on a replaced element
         * nested <a>          — a name inside a list, i.e. under two levels of
                                 container, so a disagreement about container
                                 absorption shows up as a shape difference
       Four elements would have been a comparison too small to disagree, which
       is its own kind of tolerance (判据 §2).

       `#drag` is here deliberately and is the one element expected to be
       INTERESTING. Round 8's real-machine run found `missing=['Drag source']`
       under the cdp driver and `missing=[]` under playwright_cli, ON THE SAME
       PAGE, reproduced 2/2. Both sides of THIS comparison go through
       `page_state`, so if both engines omit it the divergence is located on the
       page_state-vs-CLI axis and NOT on the engine axis — which is a result,
       not an absence of one.
       ================================================================== -->
  <h2 id="h2">Controls</h2>
  <button id="btn">Press me</button>
  <label for="txt">Your name</label>
  <input id="txt" type="text">
  <input id="chk" type="checkbox" aria-label="Agree to terms">
  <img id="pic" alt="A tiny picture"
       src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  <ul><li><a id="nested" href="/second.html">nested link</a></li></ul>
  <div id="drag" aria-label="Drag source" draggable="true">DRAGSRC</div>
</body></html>
