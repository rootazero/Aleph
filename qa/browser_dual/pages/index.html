<!doctype html>
<html><head><title>Aleph dual-engine QA</title></head>
<body>
  <h1>__MARKER__</h1>
  <!-- Two clickables on purpose. The LINK is inline, and on obscura v0.2.2 an
       inline element reports a zero box from DOM.getBoxModel,
       DOM.getContentQuads AND getBoundingClientRect() alike (measured
       2026-09-19 against the binary this fixture launches) — so it can be
       clicked by ref and NOT by coordinates. The DIV is block-level and has a
       real box (8,30 220x44 on the same run), which is what the coordinate
       half of the `click` stage aims at. Asserting both is what stops "click
       works" from meaning "one of the two worked". -->
  <a id="lnk" href="/second.html">go by ref</a>
  <div id="blk" style="display:block;width:220px;height:44px;background:#eee;cursor:pointer"
       onclick="location.href='/second.html'">go by coordinates</div>
  <span id="ghost" style="opacity:0">__MARKER__-ghost</span>
  <div id="nope" style="display:none">__MARKER__-hidden</div>
</body></html>
