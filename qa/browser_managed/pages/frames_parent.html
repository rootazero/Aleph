<!doctype html>
<html><head><meta charset="utf-8"><title>Aleph browser QA — frames</title></head>
<body>
<h1 id="marker">__MARKER__</h1>
<p id="parent-only">PARENT_BODY_TEXT</p>

<!-- The child is served by a SECOND http server on a different HOST NAME
     (`localhost` against this page's `127.0.0.1`), which makes it a different
     SITE and therefore a genuinely out-of-process iframe with its own renderer
     and its own CDP target.

     The host is what does the work, not the port. This comment used to say the
     port did, and it was wrong: Chrome partitions renderers by site (scheme +
     registrable domain) and the port is not part of a site, so the earlier
     fixture was one renderer and the OOPIF code path never ran while every
     claim passed. See `run.sh`'s CHILD_ORIGIN for the two-direction
     measurement.

     The scenario proves the cross-origin-ness in the page AND the
     out-of-process-ness out of band (a `type: "iframe"` entry in the browser's
     own target list) before it asks any question about it — cross-origin alone
     would make every later claim vacuous. -->
<iframe id="child" src="__CHILD_URL__" width="600" height="220"
        title="Cross origin child frame"></iframe>

<!-- THE SAME-RENDERER CONTROL, and it is not decoration.
     A `srcdoc` iframe has a `frameId` of its own and lives in the PAGE's
     renderer — so its `backendNodeId`s resolve against the page session and
     acting inside it works. It is the only input that separates the two
     predicates a driver could gate on: "another frame" (which this is) and
     "another renderer" (which this is not).
     A gate written as the first refuses this button while it still works —
     that shipped once, and this control is what makes it impossible to ship
     again. Same-origin preview panes, rich-text editors and payment widgets
     are all this shape. -->
<iframe id="same" width="600" height="90" title="Same renderer child frame"
        srcdoc="&lt;body style='margin:4px'&gt;
                &lt;button id='sb' aria-label='Same renderer button'
                        onclick=&quot;document.getElementById('sstate').textContent='same:yes'&quot;&gt;
                  SAME RENDERER
                &lt;/button&gt;
                &lt;div id='sstate'&gt;same:no&lt;/div&gt;
                &lt;/body&gt;"></iframe>

<div id="probe">probe:unset</div>
<script>
// Record what the parent can see of the child. On a genuinely cross-origin
// frame this MUST throw or yield null; if it yields a document, the fixture is
// testing a same-origin iframe and says so instead of quietly passing.
//
// ⚠️ Timed on the frame's `load`, not on parse. Before the child's document
// arrives the iframe still holds the initial `about:blank`, which IS
// same-origin — probing at parse time reported SAME_ORIGIN for a frame that is
// cross-origin a moment later, i.e. the control measured the wrong instant and
// would have condemned a correct fixture.
var frame = document.getElementById('child');
function probeChild() {
  try {
    var d = frame.contentDocument;
    document.getElementById('probe').textContent = d ? 'probe:SAME_ORIGIN' : 'probe:CROSS_ORIGIN';
  } catch (e) {
    document.getElementById('probe').textContent = 'probe:CROSS_ORIGIN';
  }
}
frame.addEventListener('load', probeChild);
</script>
</body></html>
