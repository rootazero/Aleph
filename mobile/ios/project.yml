name: AlephPaneliOS
options:
  bundleIdPrefix: ai.aleph
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  AlephPaneliOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AlephPaneliOSTests
    dependencies:
      - target: AlephPaneliOS
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AlephPaneliOS.app/AlephPaneliOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.aleph.panel.iossim.tests
        GENERATE_INFOPLIST_FILE: YES

  AlephPaneliOS:
    type: application
    platform: iOS
    sources:
      - AlephPaneliOS
    info:
      path: AlephPaneliOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: Aleph Panel
        CFBundleShortVersionString: ${ALEPH_VERSION}
        CFBundleVersion: ${ALEPH_BUILD}
        # App uses only OS-standard HTTPS/TLS (exempt under the standard
        # encryption exemption). Declaring this removes the per-upload export-
        # compliance prompt in App Store Connect / TestFlight.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # WKWebView loads cleartext http (remote public-IP core, or local
        # 127.0.0.1). NSAllowsArbitraryLoads alone disables ATS for ALL hosts
        # (public IP + loopback). Do NOT also add NSAllowsLocalNetworking: on
        # iOS 10+ its mere presence makes the OS IGNORE NSAllowsArbitraryLoads,
        # which re-blocks public-IP cleartext (NSURLErrorDomain -1022).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.aleph.panel
        PRODUCT_NAME: AlephPaneliOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  AlephPaneliOS:
    build:
      targets:
        AlephPaneliOS: all
    test:
      targets:
        - AlephPaneliOSTests
    run:
      config: Debug
      # The connection target is injected via the PANEL_URL env so NO secret
      # (server IP/token) lives in committed source. xcodegen expands ${PANEL_URL}
      # from the shell at generate time → the resolved value is written only into
      # the GENERATED .xcodeproj scheme, which is gitignored. project.yml itself
      # keeps just the ${PANEL_URL} placeholder. Regenerate via ./generate.sh
      # (it reads a fresh token). Empty/unset → the app shows the native pairing
      # screen (no leak).
      environmentVariables:
        - variable: PANEL_URL
          value: ${PANEL_URL}
          isEnabled: true
