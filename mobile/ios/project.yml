name: AlephPaneliOS
options:
  bundleIdPrefix: ai.aleph
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    # Swift 6 language mode (verified in the build log as `swift-version 6` —
    # an unrecognised value here is silently downgraded, so the mode has to be
    # read back, not assumed). Moving off 5.9 turned two silent hazards into
    # build-time facts: `sending 'self.probe' risks causing data races` (the
    # @MainActor `AppState` handing a non-Sendable probe to a nonisolated
    # frame), and the WebKit challenge hook no longer witnessing its @objc
    # optional requirement — that second one only warns, so it is pinned by a
    # test (`CertChallengeHookIsWiredTests`) rather than left to the log.
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  AlephPaneliOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AlephPaneliOSTests
    dependencies:
      - target: AlephPaneliOS
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AlephPaneliOS.app/AlephPaneliOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.aleph.panel.iossim.tests
        GENERATE_INFOPLIST_FILE: YES

  AlephPaneliOS:
    type: application
    platform: iOS
    sources:
      - AlephPaneliOS
    info:
      # GENERATED OUTPUT — xcodegen rewrites this file on every `generate`, so it
      # is gitignored (see .gitignore). The properties below are the source; edit
      # them here, never the plist. Version strings resolve from the repo's
      # VERSION file via ./generate.sh (dev) / ./release-testflight.sh (upload).
      path: AlephPaneliOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: Aleph Panel
        CFBundleShortVersionString: ${ALEPH_VERSION}
        CFBundleVersion: ${ALEPH_BUILD}
        # App uses only OS-standard HTTPS/TLS (exempt under the standard
        # encryption exemption). Declaring this removes the per-upload export-
        # compliance prompt in App Store Connect / TestFlight.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # ATS is now enforced for remote hosts (https required). Only loopback /
        # local-network cleartext remains allowed so simulator-side local dev with
        # http://127.0.0.1 still works. NSAllowsLocalNetworking is safe here because
        # NSAllowsArbitraryLoads is false: on iOS 10+ the presence of the local key
        # simply scopes the exception to local networks.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.aleph.panel
        PRODUCT_NAME: AlephPaneliOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  AlephPaneliOS:
    build:
      targets:
        AlephPaneliOS: all
    test:
      targets:
        - AlephPaneliOSTests
    run:
      config: Debug
      # The connection target is injected via the PANEL_URL env so NO secret
      # (server IP/token) lives in committed source. xcodegen expands ${PANEL_URL}
      # from the shell at generate time → the resolved value is written only into
      # the GENERATED .xcodeproj scheme, which is gitignored. project.yml itself
      # keeps just the ${PANEL_URL} placeholder. Regenerate via ./generate.sh
      # (it reads a fresh token). Empty/unset → the app shows the native pairing
      # screen (no leak).
      environmentVariables:
        - variable: PANEL_URL
          value: ${PANEL_URL}
          isEnabled: true
