name: Aleph Server Release

# Manual trigger only — build from a tested, stable commit.
# Version is read from the VERSION file in the repo root.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: aleph-darwin-aarch64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: aleph-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: aleph-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: aleph-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Read version from VERSION file
        id: version
        shell: bash
        run: echo "value=v$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install protobuf

      - name: Build Swift bridge (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          cd desktop/macos/bridge && swift build -c release
          mkdir -p $HOME/.aleph/bin
          cp .build/release/AlephBridge $HOME/.aleph/bin/aleph-bridge

      - name: Install protoc (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (Windows)
        if: startsWith(matrix.os, 'windows')
        run: choco install protoc -y

      - name: Install Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get install -y \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-xtest0-dev libxkbcommon-dev libxss-dev \
            libx11-dev libxrandr-dev libxi-dev libxtst-dev \
            libssl-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev \
            libdrm-dev libgbm-dev libegl-dev libxdo-dev clang libclang-dev

      # Panel WASM dist is pre-built and committed to git — no WASM build needed.
      - name: Build server
        run: cargo build --bin aleph-server --release --target ${{ matrix.target }}

      - name: Package (macOS — includes Swift bridge)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/aleph-server" aleph-server
          cp "desktop/macos/bridge/.build/release/AlephBridge" aleph-bridge
          tar -czf "${{ matrix.asset }}.tar.gz" aleph-server aleph-bridge

      - name: Package (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/aleph-server" aleph-server
          tar -czf "${{ matrix.asset }}.tar.gz" aleph-server

      - name: Package (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/aleph-server.exe" aleph-server.exe
          Compress-Archive -Path aleph-server.exe -DestinationPath "${{ matrix.asset }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip

    outputs:
      version: ${{ steps.version.outputs.value }}

  desktop-shell:
    name: Desktop Shell (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: aleph-desktop-darwin
          - os: ubuntu-24.04
            asset: aleph-desktop-linux
          - os: windows-latest
            asset: aleph-desktop-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Tauri needs the system WebView + GTK/AppIndicator headers on Linux.
      # macOS uses the system WKWebView; Windows uses bundled WebView2.
      - name: Install Tauri Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Tauri cannot cross-compile — each runner bundles its own platform.
      - name: Build desktop shell installers
        working-directory: desktop/shell
        run: cargo tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          if-no-files-found: warn
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  release:
    name: Create Release
    needs: [build, desktop-shell]
    # Release as long as the daemon build succeeded — a desktop-shell build
    # failure must not block a daemon release; its installers are simply
    # omitted from the release in that case.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Read version from VERSION file
        id: version
        run: echo "value=v$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Tag release
        run: |
          git tag "${{ steps.version.outputs.value }}" || true
          git push origin "${{ steps.version.outputs.value }}" || true

      - name: Build release body from CHANGELOG.md
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          # Extract changelog section for this version
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/release_body.md
          # Fallback if no changelog entry found
          if [ ! -s /tmp/release_body.md ]; then
            echo "See [CHANGELOG.md](https://github.com/rootazero/Aleph/blob/main/CHANGELOG.md) for details." > /tmp/release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: Aleph ${{ steps.version.outputs.value }}
          body_path: /tmp/release_body.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
            artifacts/**/*.msi
            artifacts/**/*.exe
