name: Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'
  push:
    paths:
      # `src/**` and `build.rs` were missing, and `security-clippy` lints
      # exactly those: `cargo clippy -p alephcore`. So the gate that exists to
      # keep `panic!` out of production code only ran when a *dependency*
      # changed. It went red on 2026-06-15 and stayed red for two months while
      # src/ changed daily, because nothing it watched was being touched — the
      # four panics it was reporting had been added under it, not before it.
      - 'src/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/security-audit.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/security-audit.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Run cargo audit
        run: cargo audit
        continue-on-error: true

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-deny
        run: cargo install cargo-deny
      
      - name: Run cargo deny check
        run: cargo deny check
        continue-on-error: true

  security-clippy:
    name: Security Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Install clippy onto the rust-toolchain.toml-pinned toolchain; the @stable
      # component above lands on a different version and is ignored by the override.
      - name: Add clippy to pinned toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            protobuf-compiler bubblewrap \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-xtest0-dev libxkbcommon-dev libxss-dev \
            libx11-dev libxrandr-dev libxi-dev libxtst-dev \
            libssl-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev \
            libdrm-dev libgbm-dev libegl-dev libxdo-dev clang libclang-dev
      
      # `unwrap_used`/`expect_used` are intentionally NOT denied here: the
      # codebase reserves `expect()`/`unwrap()` for truly-unreachable states
      # (e.g. compiling hardcoded static regexes), which is the documented Rust
      # style. Denying them workspace-wide flagged dozens of legitimate sites
      # and the gate never passed. Keep `panic`/`todo` denied — those signal
      # genuinely unfinished or crash-prone production code.
      - name: Run clippy with security lints
        run: |
          cargo clippy -p alephcore -- \
            -D warnings \
            -W clippy::panic \
            -W clippy::todo
