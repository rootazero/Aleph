name: Aleph Release

# Manual trigger only — build from a tested, stable commit.
# Version is read from the VERSION file in the repo root.
#
# The `publish` input selects the run mode:
#   off (default) — build the three desktop apps and upload artifacts only
#                   (CI verification: no tag, no GitHub Release).
#   on            — also tag the commit and publish a GitHub Release.
#
# Aleph ships as a native desktop app per platform: the Tauri shell bundles
# the `aleph-server` daemon (and, on macOS, the Swift bridge) inside the app.
# There is no separate bash-script install path.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Tag and publish a GitHub Release (off = build-only)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-app:
    name: Desktop App (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: aleph-macos
          - os: ubuntu-24.04
            asset: aleph-linux
          - os: windows-latest
            asset: aleph-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: startsWith(matrix.os, 'windows')
        run: choco install protoc -y

      # The daemon needs xcb/X11/etc.; Tauri needs the WebView + GTK headers.
      - name: Install Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update && sudo apt-get install -y \
            protobuf-compiler \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-xtest0-dev libxkbcommon-dev libxss-dev \
            libx11-dev libxrandr-dev libxi-dev libxtst-dev \
            libssl-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev \
            libdrm-dev libgbm-dev libegl-dev libxdo-dev clang libclang-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - name: Build Swift bridge (macOS)
        if: startsWith(matrix.os, 'macos')
        run: cd desktop/macos/bridge && swift build -c release

      # Panel WASM dist is pre-built and committed to git — no WASM build here.
      - name: Build aleph-server daemon
        run: cargo build --bin aleph-server --release

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Stage the daemon (+ Swift bridge) as Tauri externalBin inputs, then
      # bundle. Tauri cannot cross-compile — each runner builds its own app.
      #
      # Auto-update artifacts (signed update bundles + `.sig` files) are
      # produced only when the TAURI_SIGNING_PRIVATE_KEY secret is set; the
      # CalVer release model is otherwise unchanged. Without the secret the
      # build still produces the normal installers.
      - name: Stage bundled binaries and build the app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          triple="$(rustc -vV | sed -n 's/host: //p')"
          mkdir -p desktop/shell/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/release/aleph-server.exe" "desktop/shell/binaries/aleph-server-$triple.exe"
          else
            cp "target/release/aleph-server" "desktop/shell/binaries/aleph-server-$triple"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp "desktop/macos/bridge/.build/release/AlephBridge" \
               "desktop/shell/binaries/AlephBridge-$triple"
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          config="{\"version\":\"$version\"}"
          # Both the key AND its password must be configured. If the key has a
          # password but the password secret is missing / wrong, tauri-cli
          # exits 1 at the signing step and the installers we already built
          # never get uploaded. Require both so installers always ship; the
          # updater is silently skipped when the password is unavailable.
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "Signing key + password present — enabling auto-update artifacts."
            config="{\"version\":\"$version\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
          else
            echo "Signing key or password missing — building installers only (no auto-update artifacts)."
          fi
          cd desktop/shell && cargo tauri build --verbose --config "$config"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          if-no-files-found: warn
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/nsis/*.exe.sig

  release:
    name: Create Release
    needs: [desktop-app]
    # Runs only when `publish` is on. `!cancelled()` (not `success()`) so one
    # platform's build failure still ships the installers that did build.
    if: ${{ !cancelled() && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Read version from VERSION file
        id: version
        run: echo "value=v$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Tag release
        run: |
          git tag "${{ steps.version.outputs.value }}" || true
          git push origin "${{ steps.version.outputs.value }}" || true

      - name: Build release body from CHANGELOG.md
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          # Extract changelog section for this version
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/release_body.md
          # Fallback if no changelog entry found
          if [ ! -s /tmp/release_body.md ]; then
            echo "See [CHANGELOG.md](https://github.com/rootazero/Aleph/blob/main/CHANGELOG.md) for details." > /tmp/release_body.md
          fi

      # Assemble the Tauri updater manifest from each platform's signed
      # update bundle. Skipped cleanly when no `.sig` artifacts are present
      # (the signing secret was not configured for this build).
      - name: Generate updater manifest (latest.json)
        run: |
          TAG="${{ steps.version.outputs.value }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          platforms='{}'
          add() {
            if [ -f "$2" ] && [ -f "$3" ]; then
              platforms=$(jq --arg k "$1" --arg s "$(cat "$3")" \
                --arg u "$BASE/$(basename "$2")" \
                '.[$k]={signature:$s,url:$u}' <<<"$platforms")
              echo "  + $1 -> $(basename "$2")"
            else
              echo "  - $1 skipped (no updater artifact)"
            fi
          }
          add darwin-aarch64  artifacts/aleph-macos/macos/*.app.tar.gz     artifacts/aleph-macos/macos/*.app.tar.gz.sig
          add linux-x86_64    artifacts/aleph-linux/appimage/*.AppImage    artifacts/aleph-linux/appimage/*.AppImage.sig
          add windows-x86_64  artifacts/aleph-windows/nsis/*-setup.exe     artifacts/aleph-windows/nsis/*-setup.exe.sig
          if [ "$platforms" = '{}' ]; then
            echo "No updater artifacts — skipping latest.json (auto-update not configured)."
            exit 0
          fi
          jq -n --arg v "$VERSION" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson p "$platforms" \
            '{version:$v,pub_date:$d,platforms:$p}' > latest.json
          echo "--- latest.json ---"
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: Aleph ${{ steps.version.outputs.value }}
          body_path: /tmp/release_body.md
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.app.tar.gz
            artifacts/**/*.sig
            latest.json
