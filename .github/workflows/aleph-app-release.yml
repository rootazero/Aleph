name: Aleph Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish all three platform packages to GitHub Releases (off = build-only)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NSH_VERSION: v0.6.0
  NSH_INSTALLER_BASE: https://raw.githubusercontent.com/longbridge/nsh/v0.6.0/website/public

jobs:
  panel-dist-check:
    name: Panel dist pairing and WebView baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node scripts/check_panel_dist.mjs
      - run: node scripts/check_webview_baseline.mjs

  desktop-app:
    name: Desktop App (${{ matrix.platform }})
    needs: panel-dist-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            triple: aarch64-apple-darwin
            suffix: ''
          - os: ubuntu-24.04
            platform: linux
            triple: x86_64-unknown-linux-gnu
            suffix: ''
          - os: windows-latest
            platform: windows
            triple: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Enlarge swap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-xtest0-dev libxkbcommon-dev libxss-dev \
            libx11-dev libxrandr-dev libxi-dev libxtst-dev libxdo-dev \
            libssl-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev \
            libdrm-dev libgbm-dev libegl-dev clang libclang-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install NSH (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL "$NSH_INSTALLER_BASE/install.sh" -o "$RUNNER_TEMP/install-nsh.sh"
          bash "$RUNNER_TEMP/install-nsh.sh"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"

      - name: Install NSH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'install-nsh.ps1'
          Invoke-WebRequest "$env:NSH_INSTALLER_BASE/install.ps1" -OutFile $installer
          & $installer
          (Join-Path $env:LOCALAPPDATA 'nsh\bin') >> $env:GITHUB_PATH

      - name: Build and package NSH with the bundled server
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TRIPLE: ${{ matrix.triple }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TRIPLE"
          nsh --version | grep -E '^nsh 0\.6\.0( |$)'
          cargo build --locked --release -p alephcore --bin aleph-server
          server="target/release/aleph-server$SUFFIX"
          scripts/nsh_package.sh --target "$PLATFORM" --out target/nsh-out --server "$server"
          mkdir -p target/release-assets
          cp target/nsh-out/Aleph-*-"$PLATFORM"-* target/release-assets/
          if [ -f target/nsh-out/Aleph-setup.exe ]; then
            cp target/nsh-out/Aleph-setup.exe target/release-assets/
          fi
          cp "$server" "target/release-assets/aleph-server-$TRIPLE$SUFFIX"

      - uses: actions/upload-artifact@v7
        with:
          name: aleph-${{ matrix.platform }}
          if-no-files-found: error
          path: target/release-assets/

  release:
    name: Create release
    needs: desktop-app
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: aleph-*
          path: artifacts
          merge-multiple: true

      - name: Install NSH
        run: |
          curl -fsSL "$NSH_INSTALLER_BASE/install.sh" -o "$RUNNER_TEMP/install-nsh.sh"
          bash "$RUNNER_TEMP/install-nsh.sh"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"

      - name: Stage archives and update manifest
        shell: bash
        env:
          NSH_UPDATE_SECRET_KEY: ${{ secrets.NSH_UPDATE_SECRET_KEY }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          archives=(
            "artifacts/Aleph-$version-macos-aarch64.tar.gz"
            "artifacts/Aleph-$version-linux-x86_64.tar.gz"
            "artifacts/Aleph-$version-windows-x86_64.zip"
          )
          for archive in "${archives[@]}"; do test -s "$archive"; done
          test -s artifacts/aleph-server-aarch64-apple-darwin
          test -s artifacts/aleph-server-x86_64-unknown-linux-gnu
          test -s artifacts/aleph-server-x86_64-pc-windows-msvc.exe
          if [ -n "$NSH_UPDATE_SECRET_KEY" ]; then
            scripts/nsh_update_manifest.sh --out artifacts "${archives[@]}"
          else
            echo 'NSH_UPDATE_SECRET_KEY is unset. Publishing archives without an update manifest.'
          fi
          cp scripts/install.sh scripts/install.ps1 artifacts/

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo 'See CHANGELOG.md for details.' > "$RUNNER_TEMP/release-notes.md"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version"; then
            echo "Tag v$version already exists. Set a fresh VERSION and matching nsh.json version." >&2
            exit 1
          else
            test "$?" -eq 2
          fi
          gh release create "v$version" artifacts/* --target "$GITHUB_SHA" \
            --title "Aleph v$version" --notes-file "$RUNNER_TEMP/release-notes.md"
