name: Rust Core

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.rs'
      - 'tests/**'
      - 'benches/**'
      - 'desktop/**'
      - 'shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'interfaces/webchat/dist/**'
      - 'scripts/check_panel_dist.mjs'
      - '.github/workflows/aleph-core-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build.rs'
      - 'tests/**'
      - 'benches/**'
      - 'desktop/**'
      - 'shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'interfaces/webchat/dist/**'
      - 'scripts/check_panel_dist.mjs'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast gate: the committed panel dist must be a matched js+wasm pair. A
  # js-only rebuild (closure-trampoline drift) shipped the v26.6.22 blank-panel
  # bug; this catches it on push instead of at release. Node-only, no Rust.
  panel-dist:
    name: Panel dist pairing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify panel js+wasm are a matched pair
        run: node scripts/check_panel_dist.mjs

  test:
    name: Test (${{ matrix.os }})
    strategy:
      # Run every platform to completion: a flake on one OS should not cancel
      # the others, so a single round surfaces all platform failures at once.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            protobuf-compiler bubblewrap \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-xtest0-dev libxkbcommon-dev libxss-dev \
            libx11-dev libxrandr-dev libxi-dev libxtst-dev \
            libssl-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev \
            libdrm-dev libgbm-dev libegl-dev libxdo-dev clang libclang-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc

      - name: Run tests
        run: cargo test -p alephcore --lib
        env:
          PROPTEST_CASES: 1024

      - name: Run sandbox tests
        run: cargo test -p alephcore --lib sandbox

      # `--features test-helpers` gates `providers::recording_mock`, which two
      # of these need. Without it cargo silently skips them (they declare
      # `required-features`), which is how they stayed unrun for months.
      - name: Run integration tests
        run: >
          cargo test -p alephcore --features test-helpers
          --test sandbox_capability_approval
          --test memory_modes_integration
          --test note_governance_gate
          --test memory_extensions_integration
          --test memory_compound_ingest
          --test memory_reflect_integration

  lint:
    name: Lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml pins the toolchain cargo actually uses; install the
      # components onto that pinned toolchain (the @stable components above land
      # on a different version and are ignored under the override).
      - name: Add clippy/rustfmt to pinned toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            protobuf-compiler bubblewrap \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-xtest0-dev libxkbcommon-dev libxss-dev \
            libx11-dev libxrandr-dev libxi-dev libxtst-dev \
            libssl-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev \
            libdrm-dev libgbm-dev libegl-dev libxdo-dev clang libclang-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc

      - name: Check formatting
        run: cargo fmt -p alephcore -p aleph-desktop -p aleph-desktop-macos -p aleph-desktop-linux -p aleph-desktop-windows -- --check
      - name: Clippy
        run: cargo clippy -p alephcore -p aleph-desktop -- -D warnings

  # The Swift half of the desktop bridge had no CI at all: `just bridge-test`
  # exercises the wire format (golden fixtures against the committed schema.json),
  # the codec, the router, the AX locator scoring and the click-ladder ranking —
  # all pure logic, no TCC permissions, no GUI session, no Rust build. It was free
  # and simply never wired up.
  #
  # This does NOT run the computer-use e2e suite: that one drives real CGEvents at
  # a real window and needs Accessibility plus a logged-in desktop, so it stays
  # `#[ignore]`d and opt-in (`just test-computer-use-e2e`).
  swift-bridge:
    name: Swift bridge unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Swift bridge tests
        run: cd desktop/macos/bridge && swift test

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    # Non-gating, like loom-tests below. `cargo bench --no-run` is a
    # compile-only check of dev-tooling bench targets (never a product
    # artifact, and the lib's compilation is already gated by the Test jobs).
    # The hosted runner for this long job is reclaimed by GitHub infra
    # mid-compile every run (exit 143, "runner received a shutdown signal";
    # no OOM/disk signature, variable death time, only this job affected), so
    # a flaky infra death must not block the run. Benches are verified to
    # compile locally.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            protobuf-compiler bubblewrap \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-xtest0-dev libxkbcommon-dev libxss-dev \
            libx11-dev libxrandr-dev libxi-dev libxtst-dev \
            libssl-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev \
            libdrm-dev libgbm-dev libegl-dev libxdo-dev clang libclang-dev
      - name: Run benchmarks
        # `--no-run` only verifies the bench targets compile; CI never runs
        # them. The default bench profile (opt-level 3) compiling the full
        # alephcore lib in a single rustc/LLVM pass exhausts the hosted
        # runner's memory — the VM becomes unresponsive and GitHub terminates
        # it ("runner has received a shutdown signal", exit 143). Compile the
        # bench targets unoptimised: cheap, low-memory, and sufficient for a
        # build check.
        #
        # `--benches` restricts the selection to the `[[bench]]` targets. Bare
        # `cargo bench` *also* builds the lib as a test harness (the lib target
        # defaults to `bench = true`), so it was compiling all ~14.6k
        # `#[cfg(test)]` tests under the bench profile — the actual memory hog,
        # and pure waste here since the Test jobs already build that harness.
        # The log confirms it: the last thing it emitted before exit 143 was
        # warnings from `src/config/tests/dispatcher.rs`.
        env:
          CARGO_PROFILE_BENCH_OPT_LEVEL: "0"
          CARGO_PROFILE_BENCH_DEBUG: "0"
        run: cargo bench --no-run --benches

  loom-tests:
    name: Loom Concurrency
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            protobuf-compiler \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-xtest0-dev libxkbcommon-dev libxss-dev \
            libx11-dev libxrandr-dev libxi-dev libxtst-dev \
            libssl-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev \
            libdrm-dev libgbm-dev libegl-dev libxdo-dev clang libclang-dev
      - name: Run loom tests
        run: cargo test --features loom --lib
        env:
          LOOM_MAX_PREEMPTIONS: 3
        timeout-minutes: 30

  desktop-shell:
    name: Desktop Shell Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # Install clippy onto the rust-toolchain.toml-pinned toolchain (see lint job).
      - name: Add clippy to pinned toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev

      # tauri-build requires the externalBin files to exist; empty
      # placeholders satisfy `cargo check` / `clippy` without a daemon build.
      - name: Stage externalBin placeholders
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/host: //p')"
          mkdir -p desktop/shell/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            touch "desktop/shell/binaries/aleph-server-$triple.exe"
          else
            touch "desktop/shell/binaries/aleph-server-$triple"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            touch "desktop/shell/binaries/AlephBridge-$triple"
          fi

      - name: Check
        run: cargo check -p aleph-desktop-shell
      - name: Clippy
        run: cargo clippy -p aleph-desktop-shell -- -D warnings
