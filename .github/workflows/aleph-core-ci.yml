name: Rust Core

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.rs'
      - 'tests/**'
      - 'benches/**'
      - 'desktop/**'
      - 'shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'interfaces/webchat/dist/**'
      - 'interfaces/webchat/webview-baseline.json'
      - 'interfaces/webchat/baseline-probe.js'
      - 'interfaces/webchat/styles/**'
      - 'desktop/shell/tauri.conf.json'
      - 'desktop/shell/tauri.lite.conf.json'
      - 'scripts/check_panel_dist.mjs'
      - 'scripts/check_webview_baseline.mjs'
      - '.github/workflows/aleph-core-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build.rs'
      - 'tests/**'
      - 'benches/**'
      - 'desktop/**'
      - 'shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'interfaces/webchat/dist/**'
      - 'interfaces/webchat/webview-baseline.json'
      - 'interfaces/webchat/baseline-probe.js'
      - 'interfaces/webchat/styles/**'
      - 'desktop/shell/tauri.conf.json'
      - 'desktop/shell/tauri.lite.conf.json'
      - 'scripts/check_panel_dist.mjs'
      - 'scripts/check_webview_baseline.mjs'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast gate: the committed panel dist must be a matched js+wasm pair. A
  # js-only rebuild (closure-trampoline drift) shipped the v26.6.22 blank-panel
  # bug; this catches it on push instead of at release. Node-only, no Rust.
  panel-dist:
    name: Panel dist pairing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify panel js+wasm are a matched pair
        run: node scripts/check_panel_dist.mjs
      # Same job, same bare checkout. Every input this guard reads is
      # committed — the baseline JSON, both Tauri confs, the probe, the built
      # dist and stylesheet — so it needs no WASM toolchain, which is why it
      # can run here at all. Until now its only trigger was a local
      # `just wasm`, while the recipe's own doc claimed CI ran it: edges A-D,
      # including the macOS install gate, drifted with nothing watching.
      - name: Verify the declared WebView baseline is consistent
        run: node scripts/check_webview_baseline.mjs

  test:
    name: Test (${{ matrix.os }})
    strategy:
      # Run every platform to completion: a flake on one OS should not cancel
      # the others, so a single round surfaces all platform failures at once.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            protobuf-compiler bubblewrap \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-xtest0-dev libxkbcommon-dev libxss-dev \
            libx11-dev libxrandr-dev libxi-dev libxtst-dev \
            libssl-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev \
            libdrm-dev libgbm-dev libegl-dev libxdo-dev clang libclang-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc

      - name: Run tests
        run: cargo test -p alephcore --lib
        env:
          PROPTEST_CASES: 1024

      - name: Run sandbox tests
        run: cargo test -p alephcore --lib sandbox

      # `--test '*'` runs every binary in tests/, rather than a hand-kept list
      # of names. The list is what let 6 of the 132 targets that existed then run
      # while the other 126 silently did not: a new tests/ file joined CI only if
      # someone remembered to name it here, and nothing failed when they forgot.
      # The count is anchored to that moment on purpose; tests/ is +3/-1 since,
      # so no live count is asserted below either.
      #
      # It is `--test '*'` and not `--tests` for the same reason `[lib]` sets
      # `bench = false`: `--tests` selects every target with `test = true`, and
      # the lib defaults to true, so it also built *and re-ran* the whole
      # ~14.6k-test lib harness that "Run tests" just finished — and rebuilt it
      # from scratch, because `--features test-helpers` changes the feature set
      # and therefore the fingerprint. That second harness build is what took
      # the runner down ("runner has received a shutdown signal", exit 143) on
      # Linux and Windows while the far larger macOS runner survived it.
      # `--test '*'` selects exactly the tests/ binaries and nothing else.
      #
      # `--features test-helpers` gates `providers::recording_mock`, which three
      # targets declare through `required-features`. Dropping it is no longer the
      # silent hazard it was: *implicit* selection (`--tests`, bare `cargo test`)
      # skips a target whose features are unmet and still exits 0, but a glob is
      # explicit selection, so `--test '*'` now stops with `error: target ...
      # requires the features` and exit 101. Measured, cargo 1.96.0 — all four
      # forms, on Windows.
      #
      # `line-tables-only` is load-bearing, not tidiness. Without it `ld` dies
      # with `signal 7 [Bus error]`, which is what an mmap'd output file raises
      # when the filesystem cannot supply its pages. Measured on a Linux host:
      # full debuginfo makes each test binary 3.7x larger (390 MB -> 1.48 GB,
      # five targets sampled), so all 134 come to ~54 GB with the flag against
      # ~200 GB without — and the runner had 87 GB free. It does not fit.
      # That a cleanup freeing a further 17 GB "changed nothing" does not argue
      # otherwise: the shortfall is over 100 GB, so 17 GB sits below the
      # resolution of that experiment in either direction. Memory is tight too
      # — ld peaks at 5.4-9.2 GB per link without the flag against 3.3-4.4 GB
      # with it — but exhausting memory kills the runner outright (exit 143),
      # and that is the *earlier* failure, already fixed above by not building
      # the lib harness twice. Two failures, two causes; do not merge them.
      # Line tables are what a panic backtrace reads, so failures stay
      # diagnosable.
      #
      # The flag buys disk on every platform; how much is platform-specific and
      # could not be checked on macOS, where debuginfo stays out in .o/dSYM and
      # the binaries barely change size (28.46 -> 28.41 MB). Windows splits it
      # into .pdb: measured there, this step writes 20.6 GB, of which 13.3 GB is
      # .pdb against 2.5 GB of .exe, *already* at line-tables-only — 134
      # binaries, 537 passed / 0 failed, 25 min from cold. On ELF the debuginfo
      # sits inside each binary instead (92% of one, 359.3 MB of 389.6 MB), and
      # the step writes 66.6 GB — 134 binaries, 538 passed / 0 failed, 21 min
      # from cold at -j4, peaking at 12.7 GB of RAM.
      #
      # Hence `df` on both sides: this step writes 20.6 GB on Windows and
      # 66.6 GB on Linux, nothing else here reports free space, and disk is the
      # constraint that actually bit. `df -h .` names the filesystem holding the
      # workspace — where target/ lands — so it needs no per-runner knowledge of
      # C: vs D:.
      #
      # Windows gets a second reading, because that is the one runner where
      # naming the workspace volume is not enough. CARGO_HOME, rustup and TEMP
      # sit under C:\Users\runneradmin no matter which volume the workspace was
      # placed on, so this step can run C: dry while `df -h .` still reports the
      # workspace as roomy — and the failure would then point at the wrong disk.
      # Listing every FileSystem drive rather than C: alone is deliberate, for
      # the same reason `df -h .` is preferred over a hardcoded path above:
      # assuming a drive letter is the thing being avoided. Whichever volume
      # `df` named, it said nothing about the others. Bare `Get-PSDrive` already
      # prints Name / Used (GB) / Free (GB), so no formatting is needed.
      - name: Disk before integration tests
        shell: bash
        run: df -h .

      - name: Disk before integration tests (Windows volumes)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem

      - name: Run integration tests
        env:
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        run: cargo test -p alephcore --features test-helpers --test '*'

      # `always()`, or the reading dies with the failure it exists to explain.
      - name: Disk after integration tests
        if: always()
        shell: bash
        run: df -h .

      - name: Disk after integration tests (Windows volumes)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem

  lint:
    name: Lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml pins the toolchain cargo actually uses; install the
      # components onto that pinned toolchain (the @stable components above land
      # on a different version and are ignored under the override).
      - name: Add clippy/rustfmt to pinned toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            protobuf-compiler bubblewrap \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-xtest0-dev libxkbcommon-dev libxss-dev \
            libx11-dev libxrandr-dev libxi-dev libxtst-dev \
            libssl-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev \
            libdrm-dev libgbm-dev libegl-dev libxdo-dev clang libclang-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc

      - name: Check formatting
        run: cargo fmt -p alephcore -p aleph-desktop -p aleph-desktop-macos -p aleph-desktop-linux -p aleph-desktop-windows -- --check
      - name: Clippy
        run: cargo clippy -p alephcore -p aleph-desktop -- -D warnings

      # Neither step above compiles `#[cfg(test)]` code — `cargo check` does not,
      # and `cargo clippy` without `--all-targets` does not either. That hole is
      # how four tests for a deliberately-removed struct sat on main breaking the
      # lib test target: this whole job stayed green, and the Test job only said
      # so ~25 min in. Closing it here puts the answer in the fast leg.
      #
      # `--all-targets` rather than `--tests`, so benches/ are covered too.
      # Checking is metadata-only, so this costs a fraction of the Test job,
      # which has to link 134 binaries to learn the same thing.
      #
      # `-j1` is pinned, and the reason is one measured number: checking the lib
      # test target takes ~11.5 GB in a *single* rustc. This runner has 16 GB, so
      # there is no room for a second large target beside it. On a 16 GB Linux
      # box that is exactly what happens — OOM-killed at the `-j4` a 4-core
      # runner picks by default, and again at `-j2` when anything else was
      # running. `-j2` survived only with the box otherwise idle (13.0 GB system
      # peak, 6m31s with deps warm). A runner usually is idle — but a SIGKILL is
      # not a diagnostic, and a guard that dies looking like infra flake is worse
      # than no guard, so it should not have to bet on that.
      #
      # Linux only, deliberately: test code behind `#[cfg(windows)]` or
      # `#[cfg(target_os = "macos")]` stays uncovered here. Turning it on for the
      # other two wants the same memory measurement on those runners, and a Linux
      # box cannot supply it.
      - name: Check test code compiles
        if: runner.os == 'Linux'
        run: cargo check -p alephcore --all-targets -j1

  # The Swift half of the desktop bridge had no CI at all: `just bridge-test`
  # exercises the wire format (golden fixtures against the committed schema.json),
  # the codec, the router, the AX locator scoring and the click-ladder ranking —
  # all pure logic, no TCC permissions, no GUI session, no Rust build. It was free
  # and simply never wired up.
  #
  # This does NOT run the computer-use e2e suite: that one drives real CGEvents at
  # a real window and needs Accessibility plus a logged-in desktop, so it stays
  # `#[ignore]`d and opt-in (`just test-computer-use-e2e`).
  swift-bridge:
    name: Swift bridge unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Swift bridge tests
        run: cd desktop/macos/bridge && swift test

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    # Non-gating, like loom-tests below. `cargo bench --no-run` is a
    # compile-only check of dev-tooling bench targets (never a product
    # artifact, and the lib's compilation is already gated by the Test jobs).
    # The hosted runner for this long job is reclaimed by GitHub infra
    # mid-compile every run (exit 143, "runner received a shutdown signal";
    # no OOM/disk signature, variable death time, only this job affected), so
    # a flaky infra death must not block the run. Measured on Linux from cold:
    # exit 0, five executables, 12m40s, 4.96 GB of disk, peaking at 11.5 GB RSS
    # in one rustc. That peak is the alephcore lib itself — reproducible by
    # building it plus a single bench target, and it is not something this job
    # adds. The Test job compiles a *larger* unit (the lib test harness, ~14.6k
    # tests) on the same runner and survives, so the death here does not read as
    # memory, which is the reading an 11.5 GB peak would otherwise invite.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            protobuf-compiler bubblewrap \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-xtest0-dev libxkbcommon-dev libxss-dev \
            libx11-dev libxrandr-dev libxi-dev libxtst-dev \
            libssl-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev \
            libdrm-dev libgbm-dev libegl-dev libxdo-dev clang libclang-dev
      - name: Run benchmarks
        # `--no-run` only verifies the bench targets compile; CI never runs
        # them. The default bench profile (opt-level 3) compiling the full
        # alephcore lib in a single rustc/LLVM pass exhausts the hosted
        # runner's memory — the VM becomes unresponsive and GitHub terminates
        # it ("runner has received a shutdown signal", exit 143). Compile the
        # bench targets unoptimised: cheap, low-memory, and sufficient for a
        # build check.
        #
        # The lib is kept out of the selection by `bench = false` in its
        # `[lib]` section, NOT by `--benches`: that flag selects every target
        # with `bench = true`, which the lib defaults to. Without the manifest
        # opt-out this step still compiled all ~14.6k `#[cfg(test)]` tests as a
        # bench harness — the actual memory hog, and pure waste since the Test
        # jobs already build that harness. The log said so plainly: the last
        # thing it emitted before exit 143 was warnings from
        # `src/config/tests/dispatcher.rs`, which is `#[cfg(test)]` code.
        env:
          CARGO_PROFILE_BENCH_OPT_LEVEL: "0"
          CARGO_PROFILE_BENCH_DEBUG: "0"
        run: cargo bench --no-run --benches

  loom-tests:
    name: Loom Concurrency
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            protobuf-compiler \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-xtest0-dev libxkbcommon-dev libxss-dev \
            libx11-dev libxrandr-dev libxi-dev libxtst-dev \
            libssl-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev \
            libdrm-dev libgbm-dev libegl-dev libxdo-dev clang libclang-dev
      - name: Run loom tests
        run: cargo test --features loom --lib
        env:
          LOOM_MAX_PREEMPTIONS: 3
        timeout-minutes: 30

  desktop-shell:
    name: Desktop Shell Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # Install clippy onto the rust-toolchain.toml-pinned toolchain (see lint job).
      - name: Add clippy to pinned toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev

      # tauri-build requires the externalBin files to exist; empty
      # placeholders satisfy `cargo check` / `clippy` without a daemon build.
      - name: Stage externalBin placeholders
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/host: //p')"
          mkdir -p desktop/shell/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            touch "desktop/shell/binaries/aleph-server-$triple.exe"
          else
            touch "desktop/shell/binaries/aleph-server-$triple"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            touch "desktop/shell/binaries/AlephBridge-$triple"
          fi

      - name: Check
        run: cargo check -p aleph-desktop-shell
      - name: Clippy
        run: cargo clippy -p aleph-desktop-shell -- -D warnings
