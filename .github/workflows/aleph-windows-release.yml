name: Aleph Windows Release

# Manual trigger — builds Windows release binary
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: version
        shell: bash
        run: echo "value=v$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build server
        run: cargo build --bin aleph-server --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          Copy-Item "target/x86_64-pc-windows-msvc/release/aleph-server.exe" aleph-server.exe
          Compress-Archive -Path aleph-server.exe -DestinationPath aleph-windows-x86_64.zip

      - uses: actions/upload-artifact@v5
        with:
          name: aleph-windows-x86_64
          path: aleph-windows-x86_64.zip

    outputs:
      version: ${{ steps.version.outputs.value }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: version
        run: echo "value=v$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: Aleph Windows ${{ steps.version.outputs.value }}
          files: artifacts/**/*.zip
