<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aleph Dashboard</title>
    <!-- Inline so the browser never issues its default GET /favicon.ico:
         nothing serves that path, so every page load logged a 404 that cost a
         QA round to chase. A data: URI is inside the Panel CSP
         (img-src 'self' data: https:) and needs no new dist asset. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d12'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='21' fill='%23e8e6e1'%3E%E2%84%B5%3C/text%3E%3C/svg%3E" />
    <!-- Inter (UI sans) + JetBrains Mono (code) — modern variable web fonts.
         preconnect warms the TLS handshake; display=swap lets the system
         fallback paint immediately so first paint stays sub-100ms even on
         slow networks. Fallback chain in --font-sans keeps offline safe. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Noto+Sans+SC:wght@400;600&display=swap"
    />
    <link data-trunk rel="rust" data-wasm-opt="z" data-target-name="aleph-dashboard" />
    <link data-trunk rel="css" href="styles/tailwind.css" />
  </head>
  <body class="bg-surface text-text-primary">
    <noscript>This application requires JavaScript to run.</noscript>
  </body>
</html>
