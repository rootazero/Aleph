[package]
name = "aleph-panel"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
description = "Aleph Panel — Web chat interface for Aleph"
license = "MIT"
readme = "README.md"
repository = "https://github.com/rootazero/Aleph"
categories = ["web-programming", "command-line-utilities"]
keywords = ["aleph", "panel", "assistant", "automation"]

[lib]
name = "aleph_panel"
crate-type = ["cdylib", "rlib"]

# Binary target not needed for WASM build
# [[bin]]
# name = "aleph-panel"
# path = "src/main.rs"

# `src/main.rs` is a Leptos development mount point that only compiles for
# `wasm32-unknown-unknown` — it imports `leptos::mount::mount_to_body` and the
# lib's `panic_overlay::install`, both of which assume a WASM host. On a
# native target the linker hits LNK4003 ("无效的库格式") trying to link the
# rlib form of the cdylib and LNK2019 for those symbols, which fails every
# `cargo build --workspace --all-targets` (and any clippy/test invocation that
# selects all targets). Nothing in the workspace consumes it: every recipe
# that touches the panel passes `--lib`, the shipped WASM is bound from the
# cdylib by wasm-bindgen, and `cargo test -p aleph-panel --lib` is the only
# test invocation. Declaring the bin explicitly with `required-features` and
# a sentinel feature is the lightest fix that lets a developer still mount it
# locally with `--features native-dev` if they want — but the bin target
# itself is omitted so `cargo build --all-targets` and clippy do not try to
# produce a native .exe from a WASM-only entry.

[dependencies]
# Leptos framework (0.8.15 - The latest and greatest)
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_i18n = { version = "0.6", features = ["csr", "cookie", "plurals", "format_datetime", "format_nums"] }

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlElement", "Element", "Window", "Document", "Storage", "DomTokenList",
    # markdown code-block syntax theme follows OS preference in System mode
    "MediaQueryList",
    "HtmlInputElement", "File", "FileList", "FileReader", "Blob",
    "HtmlCanvasElement", "CanvasRenderingContext2d", "CanvasGradient", "TextMetrics", "DomRect",
    "MouseEvent", "WheelEvent", "TouchEvent", "TouchList", "Touch",
    "PointerEvent", "KeyboardEvent",
    "Performance",
    # cycle-2 G5 (drop zone) + G4 (clipboard copy)
    "DragEvent", "DataTransfer", "Navigator", "Clipboard",
    # canvas image drop/paste — clipboard files + off-DOM decode for natural size
    "ClipboardEvent", "HtmlImageElement",
    # canvas PNG export — download anchor (also used by transcript/home exports,
    # which had been riding a transitive feature union until now)
    "HtmlAnchorElement",
    # providers picker — keep the ArrowUp/ArrowDown row in view with
    # `block: nearest`, which scrolls the list only. The no-options overload
    # aligns to an edge and drags every scrollable ancestor with it, so each
    # keypress would also yank the settings panel behind the picker.
    "ScrollIntoViewOptions", "ScrollLogicalPosition",
    # graph_canvas rAF visibility pause (async, no forced layout)
    "IntersectionObserver", "IntersectionObserverEntry",
    # graph_canvas resize without per-frame getBoundingClientRect layout reads
    "ResizeObserver", "ResizeObserverEntry", "DomRectReadOnly",
    # theme_toggle View Transition reveal — set --theme-x/--theme-y origin
    "CssStyleDeclaration",
    # composer voice button — mic capture via MediaRecorder → base64 → STT RPC
    "MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints",
    "MediaRecorder", "MediaRecorderOptions", "BlobEvent", "BlobPropertyBag",
    # voice-loop playback — speak the agent's TTS reply via a detached <audio>.
    # MediaError backs the decoder-missing receipt: `HtmlMediaElement::error()`
    # returns `Option<MediaError>`, and `.code()` on it is the only signal that
    # distinguishes "this system cannot decode these bytes" from a rejected
    # play() promise for any other reason (usually the autoplay policy).
    "HtmlMediaElement", "HtmlAudioElement", "MediaError",
    # immersive voice mode — mic level metering via Web Audio analyser
    "AudioContext", "AnalyserNode", "MediaStreamAudioSourceNode",
    # immersive capture — continuous PCM tap (pre-roll buffer, kills leading-syllable clip)
    "ScriptProcessorNode", "AudioProcessingEvent", "AudioBuffer", "AudioDestinationNode",
    # immersive capture v2 — AudioWorklet path (audio-thread processing; the
    # deprecated ScriptProcessorNode above stays as the runtime fallback)
    "AudioWorklet", "AudioWorkletNode", "MessagePort", "MessageEvent", "BaseAudioContext",
    # immersive playback — decode TTS bytes to a buffer source on the output
    # context. WKWebView-safe: bypasses BOTH the <audio> autoplay gate and the
    # createMediaElementSource silent-bridge bug. Blob URL kept only for the
    # degraded <audio> fallback (no graph / decode failure / remote URL).
    "Url", "AudioContextState", "AudioBufferSourceNode", "AudioScheduledSourceNode",
    # 3D memory nebula — WebGL2 renderer (views/canvas/gl)
    "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer",
    "WebGlVertexArrayObject", "WebGlUniformLocation", "WebGlFramebuffer",
    "WebGlTexture", "WebGlActiveInfo",
] }
console_error_panic_hook = "0.1"

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tailwind_fuse = { version = "0.3", features = ["variant"] }
gloo-timers = { version = "0.3", features = ["futures"] }
chrono = "0.4"
futures = "0.3"

# Markdown rendering
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

# Syntax highlighting (WASM-compatible)
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
similar = { version = "2", default-features = false, features = ["text"] }

# QR-code rendering for the cold-browser pairing view (Devices → "Add browser/mobile").
# Pure-Rust + WASM-safe; `svg` feature yields a self-contained SVG string we drop
# into a div via inner_html, so no canvas / image-decoding deps are pulled in.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Internal logic
shared-ui-logic = { path = "../../shared/ui_logic", features = ["leptos", "wasm"] }
aleph-protocol = { path = "../../shared/protocol" }

# Agent-state detection for the sidebar's live agent panel — its regex + toml
# dependencies check clean under wasm32-unknown-unknown (verified at HEAD
# e860f38fe; interfaces/tui already depends on it the same way). Used only to
# look up a recognised agent's bundled manifest version for the panel row's
# dim suffix; never to run detection itself (that stays server-side).
agent-detect = { path = "../../crates/agent-detect" }

# Terminal grid rendering — must resolve to the same copy the server's PTY
# grid uses (`cargo tree -p alephcore -i unicode-width`), which is 0.2.0.
# Writing "0.1" here would pin the panel to the other copy already in the
# lockfile (a transitive dep of a dev tool) and create the very duplicate
# this pin is meant to avoid.
unicode-width = "0.2"

[build-dependencies]
leptos_i18n_build = "0.6"

[package.metadata.leptos-i18n]
default = "en"
locales = ["en", "zh"]
