[package]
name = "aleph-tui"
version.workspace = true
edition = "2021"
description = "Aleph TUI - Interactive terminal interface for Aleph"
license = "MIT"
repository.workspace = true
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["aleph", "tui", "terminal", "interface", "websocket"]

# IMPORTANT: This crate MUST NOT depend on alephcore
# It communicates with Aleph Gateway via WebSocket using aleph-protocol types.

[lib]
name = "aleph_tui"
path = "src/lib.rs"

[[bin]]
name = "aleph-tui"
path = "src/main.rs"

[dependencies]
# Aleph dependencies
aleph-client = { path = "../../shared/client" }
aleph-protocol = { path = "../../shared/protocol" }
shared-ui-logic = { path = "../../shared/ui_logic", default-features = false }

# Async runtime
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "signal", "net"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI interface
clap = { version = "4.4", features = ["derive"] }

# Terminal UI
crossterm = "0.29"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
# Maintained successor supporting Ratatui 0.30; keep the existing import alias.
tui-textarea = { package = "ratatui-textarea", version = "0.9.3" }
unicode-width = "0.2"
textwrap = "0.16"
# The same parser the Panel, the CLI and the session exporter read assistant
# markdown with; the extension set comes from `shared-ui-logic` so all four
# agree. `default-features = false` drops the `html` module a terminal has no
# use for. Same 0.13.4 copy already in the workspace graph.
pulldown-cmark = { version = "0.13.4", default-features = false }
# Fenced-code highlighting, loaded off the draw thread. Same spelling the
# Panel uses (`default-fancy` = the pure-Rust regex engine, no `onig` C
# dependency), so both surfaces highlight from the same syntax definitions.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aleph-logging = { path = "../../shared/logging" }

# Utilities
chrono = "0.4"
# `--pair`: hidden TTY prompt for the one-time ticket + fresh device id.
# Same specs the CLI already uses (rpassword 7, uuid 1.7/v4).
rpassword = "7"
uuid = { version = "1.7", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
