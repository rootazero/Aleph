[package]
name = "aleph-cli"
version.workspace = true
edition = "2021"
description = "Aleph CLI - Reference implementation of Aleph Protocol client"
license = "MIT"
readme = "README.md"
repository.workspace = true
categories = ["command-line-utilities"]
keywords = ["aleph", "cli", "assistant", "automation"]

# IMPORTANT: This crate MUST NOT depend on alephcore
# It serves as a reference implementation showing how to build
# a client using only the protocol types.

[[bin]]
name = "aleph"
path = "src/main.rs"

[dependencies]
# Aleph dependencies
aleph-client = { path = "../../shared/client" }
aleph-protocol = { path = "../../shared/protocol" }
aleph-tui = { path = "../tui" }
# TODO: Integrate aleph-sdk for discovery when CLI uses it
# aleph-sdk = { path = "../shared" }

# Async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "signal", "net", "process", "fs"] }

# WebSocket client
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async traits (for ConfigStore)
async-trait = "0.1"

# CLI interface
clap = { version = "4.4", features = ["derive", "env"] }
clap_complete = "4"


# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aleph-logging = { path = "../../shared/logging" }

# Secure password input
rpassword = "7"

# Utilities
uuid = { version = "1.7", features = ["v4"] }
chrono = "0.4"
dirs = "6.0"

# Markdown → ANSI rendering for human-facing assistant output
pulldown-cmark = { version = "0.12", default-features = false }

# CJK / wide-character aware display widths for aligned table/detail output
unicode-width = "0.2"

# Plugin packaging
zip = { version = "2", default-features = false, features = ["deflate"] }

# Base64 encoding for shipping local plugin zips to the daemon over JSON-RPC
base64 = "0.22"

# Unix process management (signals)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"

[lints.rust]
# Ensure we don't accidentally depend on alephcore
unexpected_cfgs = "warn"
