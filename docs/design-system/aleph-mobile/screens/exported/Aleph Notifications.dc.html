<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles/aleph.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    background:
      radial-gradient(60% 50% at 18% 12%, oklch(0.62 0.10 310 / 0.18), transparent 70%),
      radial-gradient(70% 60% at 88% 96%, oklch(0.60 0.09 250 / 0.16), transparent 70%),
      oklch(0.93 0.006 290);
    font-family: var(--font-sans);
  }
  .cc-hide-scroll { scrollbar-width: none; -ms-overflow-style: none; }
  .cc-hide-scroll::-webkit-scrollbar { display: none; }
</style>
</helmet>

<div style="position:relative; width:418px; padding:14px; border-radius:62px; background:linear-gradient(150deg, oklch(0.30 0.02 300), oklch(0.16 0.015 300)); box-shadow: 0 2px 6px oklch(0.2 0.02 310 / .2), 0 30px 80px oklch(0.25 0.03 310 / .35), inset 0 0 0 2px oklch(0.45 0.02 300 / .5); ">

  <div data-screen-label="Notifications" data-material="liquid" style="position:relative; width:390px; height:844px; border-radius:48px; overflow:hidden; background:
      radial-gradient(120% 55% at 50% 0%, oklch(0.62 0.10 310 / 0.14), transparent 62%),
      radial-gradient(120% 45% at 50% 100%, oklch(0.60 0.09 250 / 0.10), transparent 60%),
      var(--color-surface); display:flex; flex-direction:column;">

    <!-- Status bar -->
    <div style="position:relative; height:54px; flex:none; display:flex; align-items:flex-end; justify-content:space-between; padding:0 26px 6px; z-index:5;">
      <span class="tabular-nums" style="font-size:15px; font-weight:600; color:var(--color-text-primary); letter-spacing:0;">9:41</span>
      <div style="display:flex; align-items:center; gap:7px; color:var(--color-text-primary);">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.4"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1 4.2A11 11 0 0 1 16 4.2"/><path d="M3.4 6.7A7.4 7.4 0 0 1 13.6 6.7"/><path d="M5.8 9.2a3.9 3.9 0 0 1 5.4 0"/><circle cx="8.5" cy="11" r="0.6" fill="currentColor"/></svg>
        <div style="display:flex; align-items:center; gap:2px;"><div style="width:22px; height:11px; border:1.3px solid currentColor; border-radius:3px; padding:1.5px; opacity:.85;"><div style="width:75%; height:100%; background:currentColor; border-radius:1px;"></div></div><div style="width:1.5px; height:4px; background:currentColor; border-radius:1px; opacity:.6;"></div></div>
      </div>
    </div>
    <!-- Dynamic island -->
    <div style="position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:34px; background:#000; border-radius:20px; z-index:6;"></div>

    <!-- Top bar (modal) -->
    <div class="glass" style="flex:none; display:flex; align-items:center; gap:6px; min-height:50px; padding:4px 8px 8px; z-index:4; background-color:color-mix(in oklch, var(--color-surface-overlay) 78%, transparent);">
      <button class="btn btn-icon btn-ghost" aria-label="back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
      </button>
      <span style="flex:1; font-size:18px; font-weight:700; letter-spacing:-0.02em; color:var(--color-text-primary);">Notifications</span>
      <button class="btn btn-ghost btn-sm" style="min-height:36px;">Clear</button>
    </div>

    <!-- Body -->
    <div class="cc-hide-scroll" style="flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:18px; padding:16px 16px calc(20px + var(--safe-area-bottom));">

      <!-- Approval request card -->
      <div>
        <div style="font-size:12px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; color:var(--color-text-tertiary); padding:0 2px 8px;">需要批准</div>
        <div class="card" style="position:relative; padding-left:1.15rem; overflow:hidden;">
          <span style="position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--color-primary);"></span>
          <div style="display:flex; align-items:center; gap:9px;">
            <span style="display:inline-flex; width:30px; height:30px; border-radius:var(--radius-md); align-items:center; justify-content:center; background:var(--color-primary-subtle); color:var(--color-primary); flex:none;">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            </span>
            <div style="flex:1; min-width:0;">
              <div class="card-title">Agent 想执行 shell 命令</div>
              <div class="card-sub" style="margin-top:1px;">Maker · 刚刚请求</div>
            </div>
            <span class="badge badge-warning" style="flex:none;">待批准</span>
          </div>
          <div class="glass-inset mono" style="margin-top:11px; padding:10px 12px; border-radius:var(--radius-md); font-size:13px; color:var(--color-text-primary); display:flex; align-items:center; gap:8px;">
            <span style="color:var(--color-text-tertiary); user-select:none;">$</span>
            <span>rm -rf build/</span>
          </div>
          <div style="display:flex; gap:10px; margin-top:13px;">
            <button class="btn btn-secondary" style="flex:1;">拒绝</button>
            <button class="btn btn-primary" style="flex:1;">批准</button>
          </div>
        </div>
      </div>

      <!-- Notification list -->
      <div>
        <div style="font-size:12px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; color:var(--color-text-tertiary); padding:0 2px 8px;">最近</div>
        <div class="list">
          <div class="cell" style="align-items:flex-start;">
            <span class="cell-leading" style="background:var(--color-success-subtle); color:var(--color-success); margin-top:1px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            <div class="cell-body">
              <div class="cell-title" style="font-weight:500;">Memory 重嵌入完成</div>
              <div class="cell-sub" style="margin-top:1px;">128 条记忆已更新向量</div>
            </div>
            <span class="cell-value" style="flex:none;">2 分钟前</span>
          </div>
          <div class="cell" style="align-items:flex-start;">
            <span class="cell-leading" style="background:var(--color-warning-subtle); color:var(--color-warning); margin-top:1px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.8 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg></span>
            <div class="cell-body">
              <div class="cell-title" style="font-weight:500;">与 core 短暂断开,已恢复</div>
              <div class="cell-sub" style="margin-top:1px;">重连耗时 4s,无数据丢失</div>
            </div>
            <span class="cell-value" style="flex:none;">1 小时前</span>
          </div>
          <div class="cell" style="align-items:flex-start;">
            <span class="cell-leading" style="background:var(--color-info-subtle); color:var(--color-info); margin-top:1px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><circle cx="12" cy="8" r="0.6" fill="currentColor"/></svg></span>
            <div class="cell-body">
              <div class="cell-title" style="font-weight:500;">Cron:早报已投递</div>
              <div class="cell-sub" style="margin-top:1px;">3 条要闻 · 2 个日程提醒</div>
            </div>
            <span class="cell-value" style="flex:none;">今天 8:00</span>
          </div>
          <div class="cell" style="align-items:flex-start;">
            <span class="cell-leading" style="background:var(--color-success-subtle); color:var(--color-success); margin-top:1px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            <div class="cell-body">
              <div class="cell-title" style="font-weight:500;">部署 v26.6.24 完成</div>
              <div class="cell-sub mono" style="margin-top:1px; font-size:12.5px;">production · 18790</div>
            </div>
            <span class="cell-value" style="flex:none;">昨天</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Home indicator -->
    <div style="position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:var(--radius-full); background:var(--color-text-primary); opacity:.28; z-index:7;"></div>

  </div>
</div>
</x-dc>
</body>
</html>
