<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles/aleph.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    background:
      radial-gradient(60% 50% at 18% 12%, oklch(0.62 0.10 310 / 0.18), transparent 70%),
      radial-gradient(70% 60% at 88% 96%, oklch(0.60 0.09 250 / 0.16), transparent 70%),
      oklch(0.93 0.006 290);
    font-family: var(--font-sans);
  }
  @keyframes cc-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
  @keyframes cc-flow { to { transform: rotate(360deg); } }
  @keyframes cc-ring { 0% { transform: scale(0.82); opacity: .55; } 100% { transform: scale(1.55); opacity: 0; } }
  @keyframes cc-eq { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
  @keyframes cc-dot { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
</style>
</helmet>

<div style="position:relative; width:418px; padding:14px; border-radius:62px; background:linear-gradient(150deg, oklch(0.30 0.02 300), oklch(0.16 0.015 300)); box-shadow: 0 2px 6px oklch(0.2 0.02 310 / .2), 0 30px 80px oklch(0.25 0.03 310 / .35), inset 0 0 0 2px oklch(0.45 0.02 300 / .5); ">

  <div data-screen-label="Voice" data-material="liquid" style="position:relative; width:390px; height:844px; border-radius:48px; overflow:hidden; display:flex; flex-direction:column; align-items:center; background:
      radial-gradient(90% 42% at 50% 116%, oklch(0.66 0.14 314 / 0.62), transparent 62%),
      radial-gradient(140% 64% at 50% 124%, oklch(0.60 0.12 308 / 0.34), transparent 66%),
      radial-gradient(120% 50% at 50% -8%, oklch(0.60 0.08 280 / 0.16), transparent 58%),
      var(--color-surface);">

    <!-- Status bar -->
    <div style="position:relative; width:100%; height:54px; flex:none; display:flex; align-items:flex-end; justify-content:space-between; padding:0 26px 6px; z-index:5;">
      <span class="tabular-nums" style="font-size:15px; font-weight:600; color:var(--color-text-primary); letter-spacing:0;">9:41</span>
      <div style="display:flex; align-items:center; gap:7px; color:var(--color-text-primary);">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.4"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1 4.2A11 11 0 0 1 16 4.2"/><path d="M3.4 6.7A7.4 7.4 0 0 1 13.6 6.7"/><path d="M5.8 9.2a3.9 3.9 0 0 1 5.4 0"/><circle cx="8.5" cy="11" r="0.6" fill="currentColor"/></svg>
        <div style="display:flex; align-items:center; gap:2px;"><div style="width:22px; height:11px; border:1.3px solid currentColor; border-radius:3px; padding:1.5px; opacity:.85;"><div style="width:75%; height:100%; background:currentColor; border-radius:1px;"></div></div><div style="width:1.5px; height:4px; background:currentColor; border-radius:1px; opacity:.6;"></div></div>
      </div>
    </div>
    <!-- Dynamic island -->
    <div style="position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:34px; background:#000; border-radius:20px; z-index:6;"></div>

    <!-- Minimal top status -->
    <div style="flex:none; display:inline-flex; align-items:center; gap:7px; margin-top:10px; padding:6px 13px; border-radius:var(--radius-full); background:color-mix(in oklch, var(--color-surface-raised) 65%, transparent); border:1px solid var(--color-border-subtle); font-size:12.5px; font-weight:600; color:var(--color-text-secondary);">
      <span style="width:7px; height:7px; border-radius:var(--radius-full); background:var(--color-primary); animation:cc-dot 1.4s ease-in-out infinite;"></span>
      Assistant · 聆听中
    </div>

    <!-- Orb -->
    <div style="flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; width:100%;">

      <div style="position:relative; width:208px; height:208px; display:flex; align-items:center; justify-content:center;">
        <!-- sonar rings -->
        <div style="position:absolute; inset:0; border-radius:var(--radius-full); border:1.5px solid color-mix(in oklch, var(--color-primary) 40%, transparent); animation:cc-ring 2.8s var(--ease-out) infinite;"></div>
        <div style="position:absolute; inset:0; border-radius:var(--radius-full); border:1.5px solid color-mix(in oklch, var(--color-primary) 40%, transparent); animation:cc-ring 2.8s var(--ease-out) infinite; animation-delay:1.4s;"></div>

        <!-- orb body -->
        <div style="position:relative; width:176px; height:176px; border-radius:var(--radius-full); overflow:hidden; animation:cc-breathe 4s ease-in-out infinite;
            background:radial-gradient(circle at 40% 34%, oklch(0.90 0.04 318), oklch(0.70 0.11 314) 50%, oklch(0.56 0.13 306) 100%);
            box-shadow: 0 18px 54px oklch(0.58 0.14 312 / .55), 0 0 36px oklch(0.70 0.13 314 / .45), 0 0 0 1px oklch(1 0 0 / .30) inset, 0 3px 10px oklch(1 0 0 / .45) inset;">
          <!-- flowing inner light -->
          <div style="position:absolute; inset:-25%; border-radius:var(--radius-full); opacity:.6; mix-blend-mode:screen; filter:blur(16px); animation:cc-flow 11s linear infinite;
            background:radial-gradient(35% 35% at 30% 35%, oklch(0.95 0.05 320 / .95), transparent 70%), radial-gradient(38% 38% at 72% 64%, oklch(0.74 0.12 272 / .8), transparent 72%);"></div>
          <!-- top highlight -->
          <div style="position:absolute; top:18px; left:30px; width:62px; height:38px; border-radius:var(--radius-full); background:radial-gradient(circle, oklch(1 0 0 / .8), transparent 70%); filter:blur(3px);"></div>
        </div>
      </div>

      <!-- live equalizer -->
      <div style="display:flex; align-items:center; gap:5px; height:26px;">
        <span style="width:4px; height:100%; border-radius:var(--radius-full); background:var(--color-primary); transform-origin:center; animation:cc-eq 0.9s ease-in-out infinite; animation-delay:0s;"></span>
        <span style="width:4px; height:100%; border-radius:var(--radius-full); background:var(--color-primary); transform-origin:center; animation:cc-eq 0.9s ease-in-out infinite; animation-delay:.18s;"></span>
        <span style="width:4px; height:100%; border-radius:var(--radius-full); background:var(--color-primary); transform-origin:center; animation:cc-eq 0.9s ease-in-out infinite; animation-delay:.36s;"></span>
        <span style="width:4px; height:100%; border-radius:var(--radius-full); background:var(--color-primary); transform-origin:center; animation:cc-eq 0.9s ease-in-out infinite; animation-delay:.12s;"></span>
        <span style="width:4px; height:100%; border-radius:var(--radius-full); background:var(--color-primary); transform-origin:center; animation:cc-eq 0.9s ease-in-out infinite; animation-delay:.30s;"></span>
        <span style="width:4px; height:100%; border-radius:var(--radius-full); background:var(--color-primary); transform-origin:center; animation:cc-eq 0.9s ease-in-out infinite; animation-delay:.05s;"></span>
        <span style="width:4px; height:100%; border-radius:var(--radius-full); background:var(--color-primary); transform-origin:center; animation:cc-eq 0.9s ease-in-out infinite; animation-delay:.24s;"></span>
      </div>

      <!-- captions -->
      <div style="width:100%; padding:0 36px; text-align:center;">
        <p style="margin:0; font-size:23px; line-height:1.42; font-weight:600; letter-spacing:-0.01em; color:var(--color-text-primary); text-wrap:balance;">
          帮我把今天的会议纪要<br>整理一下&hellip;
        </p>
        <p style="margin:14px 0 0; font-size:14px; color:var(--color-text-tertiary);">松开结束</p>
      </div>
    </div>

    <!-- End button -->
    <div style="flex:none; padding-bottom:calc(34px + var(--safe-area-bottom)); display:flex; flex-direction:column; align-items:center; gap:14px;">
      <button aria-label="end voice" style="width:66px; height:66px; border-radius:var(--radius-full); display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
          background:var(--color-surface-raised); border:1.5px solid color-mix(in oklch, var(--color-danger) 45%, var(--color-border)); color:var(--color-danger); box-shadow:var(--shadow-lg);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
      </button>
    </div>

    <!-- Home indicator -->
    <div style="position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:var(--radius-full); background:var(--color-text-primary); opacity:.28; z-index:7;"></div>

  </div>
</div>
</x-dc>
</body>
</html>
