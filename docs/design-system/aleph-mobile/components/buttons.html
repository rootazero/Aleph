<!-- @dsCard group="Components" name="Buttons" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buttons — Aleph</title>
<link rel="stylesheet" href="../styles/aleph.css">
</head>
<body>
  <div class="ds-stage">
    <div class="ds-panel" style="background:var(--color-surface);max-width:320px">
      <div class="ds-label">Light · 44px touch</div>
      <div class="ds-col">
        <div class="ds-row">
          <button class="btn btn-primary">Primary</button>
          <button class="btn btn-secondary">Secondary</button>
        </div>
        <div class="ds-row">
          <button class="btn btn-ghost">Ghost</button>
          <button class="btn btn-danger">Delete</button>
        </div>
        <div class="ds-row">
          <button class="btn btn-primary btn-sm">Small</button>
          <button class="btn btn-icon btn-secondary" aria-label="add">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button class="btn btn-icon btn-primary" aria-label="send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
        <button class="btn btn-primary btn-block">Full-width action</button>
      </div>
    </div>

    <div class="ds-panel dark" style="background:var(--color-surface);max-width:320px">
      <div class="ds-label">Dark</div>
      <div class="ds-col">
        <div class="ds-row">
          <button class="btn btn-primary">Primary</button>
          <button class="btn btn-secondary">Secondary</button>
        </div>
        <div class="ds-row">
          <button class="btn btn-ghost">Ghost</button>
          <button class="btn btn-danger">Delete</button>
        </div>
        <button class="btn btn-primary btn-block">Full-width action</button>
      </div>
    </div>
  </div>
</body>
</html>
