<!-- @dsCard group="Components" name="List cells (settings)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List cells — Aleph</title>
<link rel="stylesheet" href="../styles/aleph.css">
<style>
  .chev{ }
  .toggle{ width:44px;height:26px;border-radius:var(--radius-full);background:var(--color-primary);position:relative;flex:none; }
  .toggle::after{ content:"";position:absolute;top:3px;left:21px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm); }
  .toggle.off{ background:var(--color-border-strong); }
  .toggle.off::after{ left:3px; }
</style>
</head>
<body>
  <div class="ds-stage">
    <div class="ds-panel" style="background:var(--color-surface);width:320px">
      <div class="ds-label">Settings group · Light</div>
      <div class="list-header">AI</div>
      <div class="list" style="margin-bottom:18px">
        <div class="cell">
          <span class="cell-leading">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4"/></svg>
          </span>
          <span class="cell-body"><div class="cell-title">Providers</div></span>
          <span class="cell-value">Anthropic</span>
          <span class="cell-chevron"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></span>
        </div>
        <div class="cell">
          <span class="cell-leading">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/></svg>
          </span>
          <span class="cell-body"><div class="cell-title">Embeddings</div></span>
          <span class="cell-value">text-embedding-3</span>
          <span class="cell-chevron"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></span>
        </div>
        <div class="cell">
          <span class="cell-leading">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          </span>
          <span class="cell-body"><div class="cell-title">Stream replies</div><div class="cell-sub">Token-by-token</div></span>
          <span class="toggle"></span>
        </div>
      </div>
      <div class="ds-label">Memory result row</div>
      <div class="list">
        <div class="cell">
          <span class="cell-body">
            <div class="cell-title">用户偏好用中文回复</div>
            <div class="cell-sub">preference · 2026-06-20</div>
          </span>
          <span class="badge badge-primary">fact</span>
        </div>
      </div>
    </div>

    <div class="ds-panel dark" style="background:var(--color-surface);width:320px">
      <div class="ds-label">Dark</div>
      <div class="list">
        <div class="cell">
          <span class="cell-leading"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M2 12h4M18 12h4"/></svg></span>
          <span class="cell-body"><div class="cell-title">Providers</div></span>
          <span class="cell-value">Anthropic</span>
          <span class="cell-chevron"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></span>
        </div>
        <div class="cell">
          <span class="cell-body"><div class="cell-title">Stream replies</div></span>
          <span class="toggle off"></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
