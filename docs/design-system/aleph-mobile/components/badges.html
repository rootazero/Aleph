<!-- @dsCard group="Components" name="Badges · chips · segmented" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badges — Aleph</title>
<link rel="stylesheet" href="../styles/aleph.css">
<style>
  .seg{ display:inline-flex; padding:3px; background:var(--color-surface-sunken); border-radius:var(--radius-lg); }
  .seg button{ border:0; background:none; font:inherit; font-size:.8125rem; font-weight:500; padding:.4rem .9rem; border-radius:calc(var(--radius-lg) - 3px); color:var(--color-text-secondary); cursor:pointer; }
  .seg button.on{ background:var(--color-surface-raised); color:var(--color-text-primary); box-shadow:var(--shadow-sm); font-weight:600; }
</style>
</head>
<body>
  <div class="ds-stage">
    <div class="ds-panel" style="background:var(--color-surface);width:320px">
      <div class="ds-label">Status badges</div>
      <div class="ds-row" style="margin-bottom:20px">
        <span class="badge badge-primary">fact</span>
        <span class="badge badge-success">success</span>
        <span class="badge badge-warning">pending</span>
        <span class="badge badge-danger">error</span>
        <span class="badge badge-info">info</span>
      </div>

      <div class="ds-label">Chips (facet filters)</div>
      <div class="ds-row" style="margin-bottom:20px">
        <span class="chip chip-active">All</span>
        <span class="chip">Facts</span>
        <span class="chip">Notes</span>
        <span class="chip">Corrections</span>
      </div>

      <div class="ds-label">Segmented control</div>
      <div class="seg">
        <button class="on">Graph</button>
        <button>Vault</button>
      </div>
    </div>

    <div class="ds-panel dark" style="background:var(--color-surface);width:320px">
      <div class="ds-label">Dark</div>
      <div class="ds-row" style="margin-bottom:18px">
        <span class="badge badge-primary">fact</span>
        <span class="badge badge-success">success</span>
        <span class="badge badge-warning">pending</span>
        <span class="badge badge-danger">error</span>
      </div>
      <div class="ds-row">
        <span class="chip chip-active">All</span>
        <span class="chip">Facts</span>
        <span class="chip">Notes</span>
      </div>
    </div>
  </div>
</body>
</html>
