<!-- @dsCard group="Components" name="Cards" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards — Aleph</title>
<link rel="stylesheet" href="../styles/aleph.css">
</head>
<body>
  <div class="ds-stage">
    <div class="ds-panel" style="background:var(--color-surface);width:300px">
      <div class="ds-label">Light</div>
      <div class="ds-col">
        <!-- Standard raised card -->
        <div class="card">
          <div class="card-title">Memory online</div>
          <p class="card-sub" style="margin:.25rem 0 .75rem">SQLite + sqlite-vec · 1,248 facts</p>
          <div class="glass-inset" style="border-radius:var(--radius-lg);padding:.625rem .75rem">
            <span class="card-sub mono">glass-inset · nested surface</span>
          </div>
        </div>
        <!-- Stat card -->
        <div class="card">
          <div class="ds-label" style="margin:0 0 .25rem">Tokens today</div>
          <div class="tabular-nums" style="font-size:1.75rem;font-weight:600">12,480</div>
          <span class="badge badge-success" style="margin-top:.5rem">▲ 8%</span>
        </div>
      </div>
    </div>

    <div class="ds-panel dark" style="background:var(--color-surface);width:300px">
      <div class="ds-label">Dark</div>
      <div class="card">
        <div class="card-title">Memory online</div>
        <p class="card-sub" style="margin:.25rem 0 .75rem">SQLite + sqlite-vec · 1,248 facts</p>
        <div class="glass-inset" style="border-radius:var(--radius-lg);padding:.625rem .75rem">
          <span class="card-sub mono">glass-inset · nested</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
