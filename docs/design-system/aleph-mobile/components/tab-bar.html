<!-- @dsCard group="Components" name="Tab bar + top bar (mobile nav)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation — Aleph</title>
<link rel="stylesheet" href="../styles/aleph.css">
</head>
<body>
  <div class="ds-stage">
    <!-- In a phone frame -->
    <div class="phone">
      <div class="phone-screen">
        <!-- top bar -->
        <div class="topbar" style="border-bottom:1px solid var(--color-border-subtle)">
          <span class="topbar-title" style="flex:1;display:flex;align-items:center;gap:.35rem">
            Assistant
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-text-tertiary)"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
          <button class="btn btn-icon btn-ghost" aria-label="notifications">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          </button>
        </div>
        <!-- body -->
        <div style="flex:1;padding:16px;color:var(--color-text-tertiary);font-size:.8125rem">Chat surface…</div>
        <!-- bottom tab bar -->
        <div class="tabbar">
          <button class="tabitem tabitem-active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.7 8.7 0 0 1-4-1L3 20l1-5.5a8.4 8.4 0 0 1-1-4A8.4 8.4 0 0 1 11.5 2 8.4 8.4 0 0 1 21 11.5z"/></svg>
            Chat
          </button>
          <button class="tabitem">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2.4"/><circle cx="18" cy="8" r="2.4"/><circle cx="11" cy="17" r="2.4"/><path d="M8 8.4l1.5 6.4M15.8 9.6L12.6 15.6"/></svg>
            Memory
          </button>
          <button class="tabitem">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>
            Agents
          </button>
          <button class="tabitem">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 6.6 19l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 4 13.6H4a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 5 6.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10.4 4V4a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 17 5l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
            Settings
          </button>
        </div>
      </div>
    </div>

    <!-- Standalone bar, dark -->
    <div class="ds-panel dark" style="background:var(--color-surface);width:300px">
      <div class="ds-label">Tab bar · Dark</div>
      <div class="tabbar" style="border-radius:var(--radius-lg);border:1px solid var(--color-border-subtle)">
        <button class="tabitem tabitem-active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.7 8.7 0 0 1-4-1L3 20l1-5.5a8.4 8.4 0 0 1-1-4A8.4 8.4 0 0 1 11.5 2 8.4 8.4 0 0 1 21 11.5z"/></svg>Chat</button>
        <button class="tabitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2.4"/><circle cx="18" cy="8" r="2.4"/><circle cx="11" cy="17" r="2.4"/><path d="M8 8.4l1.5 6.4M15.8 9.6L12.6 15.6"/></svg>Memory</button>
        <button class="tabitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>Agents</button>
        <button class="tabitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12l1.6-1-1.2-2-1.9.5-1.5-1L15.4 5h-2.8l-.6 2-1.9.5L8.6 7 7.4 9 9 10l-.4 2L7 13l1.2 2 1.9-.5 1.5 1 .6 2h2.8l.6-2 1.9-.5 1.6.5 1.2-2-1.6-1z"/></svg>Settings</button>
      </div>
    </div>
  </div>
</body>
</html>
