<!doctype html><meta charset=utf-8><title>probe</title>
<style>
body{margin:0;font:16px sans-serif}
#box{width:300px;height:200px;background:#c33;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px}
#spin{width:60px;height:60px;border:8px solid #ddd;border-top-color:#36c;border-radius:50%;animation:r 1s linear infinite;margin:20px}
@keyframes r{to{transform:rotate(360deg)}}
#name{font-size:20px;width:400px}
</style>
<div id=box>0</div>
<div id=spin></div>
<div id=clock>--</div>
<input id=name placeholder="name">
<div style="height:3000px;background:linear-gradient(#fff,#88f)"></div>
<script>
let n=0;const box=document.getElementById('box');
box.addEventListener('click',()=>{n++;box.textContent=n;box.style.background=n%2?'#3a3':'#c33';});
setInterval(()=>{document.getElementById('clock').textContent=Date.now();},100);
</script>
