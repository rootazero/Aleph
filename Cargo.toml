reqwest = { version = "0.12", features = ["json", "native-tls", "stream", "multipart"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
dirs = "5.0"
log = "0.4"
tracing = "0.1"
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
notify = { version = "6.1", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = "0.3"
user-idle = "0.5"
shellexpand = "3.1"
handlebars = "5.1"
jsonpath-rust = "0.5"
image = { workspace = true }
base64 = { workspace = true }
async-trait = "0.1"
anyhow = "1.0"
arc-swap = "1"
futures = "0.3"
async-stream = "0.3"
once_cell = "1.19"
serde_yaml = "0.9"
zip = "2.2"
tempfile = "3.8"
git2 = { version = "0.19", features = ["vendored-openssl"] }
glob = "0.3"
glob-match = "0.2"
walkdir = "2.5"
which = "6.0"
schemars = "0.8"
jsonschema = "0.29"
scraper = "0.22"
readability = "0.3"
htmd = "0.1"
url = "2.5"
lru = "0.12"
sha2 = "0.10"
hmac = "0.12"
jsonwebtoken = "9"
subtle = "2.5"
