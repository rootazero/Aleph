# Aleph Workspace Configuration
# This workspace manages the shared Rust core library for cross-platform builds

[workspace]
resolver = "2"
members = [
    "desktop/shared",
    "desktop/macos",
    "desktop/linux",
    "desktop/windows",
    "desktop/shell",
    "shared/logging",
    "shared/protocol",
    "shared/ui_logic",

    "shared/client",

    "interfaces/cli",
    "interfaces/tui",
    "interfaces/webchat",
]

[workspace.package]
# CalVer — keep in sync with the VERSION file (single source of truth).
# build.rs re-exposes the VERSION file as env!("ALEPH_VERSION") at compile time.
version = "26.7.21"
edition = "2021"
license = "MIT"
repository = "https://github.com/rootazero/Aleph"
rust-version = "1.95"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "sync", "time", "macros", "process", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
thiserror = "2.0"

# Database
rusqlite = { version = "0.37", features = ["bundled"] }

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
once_cell = "1.19"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# File watching
notify = { version = "6.1", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = "0.3"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff"] }
base64 = "0.22"

# Async utilities
async-trait = "0.1"
futures = "0.3"

# Archive handling
zip = "2.2"
flate2 = "1.0"
tar = "0.4"

# Git operations
git2 = "0.19"
glob = "0.3"

# System info
hostname = "0.4"
whoami = "1.5"

# Schema generation
schemars = "1.2"

# Web scraping
scraper = "0.22"
url = "2.5"

# Caching
lru = "0.12"

# mDNS service discovery
mdns-sd = "0.11"

# Crypto / cert parsing (shared with desktop/shell cert_trust)
sha2 = "0.10"
hex = "0.4"
x509-parser = "0.17"

# UniFFI removed - using Gateway WebSocket architecture

# ===== Package (alephcore) =====

[package]
name = "alephcore"
version.workspace = true
edition = "2021"
rust-version = "1.95"

[lib]
crate-type = ["rlib", "cdylib"]
name = "alephcore"

[features]
default = []
# Loom concurrency testing (replaces std sync primitives)
loom = ["dep:loom"]
# Test helpers for integration tests
test-helpers = []
# Control plane UI (Leptos/WASM dashboard)
control-plane = []
# Disabled test modules awaiting rewrite
disabled-tests = []
# Reserved placeholder for the in-flight WASM plugin runtime. Declared
# so tests/wasm_capability_test.rs can keep its `cfg(feature =
# "plugin-wasm")` gate without tripping rustc's unexpected-cfg lint
# until the runtime lands.
plugin-wasm = []
[dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "sync", "time", "macros", "process", "fs", "io-util", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt", "compat"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
aleph-protocol = { path = "shared/protocol" }
rusqlite = { version = "0.37", features = ["bundled"] }
sqlite-vec = "0.1.9"
uuid = { version = "1.7", features = ["v4", "serde"] }
regex = "1.10"
aho-corasick = "1.1"
percent-encoding = "2.3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ipnet = "2"
rand = "0.10"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "native-tls", "stream"] }
bytes = "1"
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
dirs = "6.0"
log = "0.4"
tracing = "0.1"
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
notify = { version = "6.1", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = "0.3"
user-idle = "0.5"
shellexpand = "3.1"
handlebars = "6"
jsonpath-rust = "1.0"
image = { workspace = true }
base64 = { workspace = true }
async-trait = "0.1"
anyhow = "1.0"
arc-swap = "1"
fs2 = "0.4"
futures = "0.3"
async-stream = "0.3"
once_cell = "1.19"
serde_yaml = "0.9"
zip = "2.2"
tempfile = "3.8"
git2 = { version = "0.19", features = ["vendored-openssl"] }
glob = "0.3"
glob-match = "0.2"
walkdir = "2.5"
which = "6.0"
schemars = "1.2"
jsonschema = "0.29"
scraper = "0.22"
readability = "0.3"
htmd = "0.1"
url = "2.5"
idna = "1"
lru = "0.12"
sha2 = "0.10"
hmac = "0.12"
jsonwebtoken = "9"
subtle = "2.5"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
siphasher = "1.0"
aes-gcm = "0.10"
aes = "0.9"
cipher = "0.5"
# AES-256-CBC (cipher 0.4 line) for Feishu webhook event decryption — pairs with `cbc`.
aes_cbc = { package = "aes", version = "0.8" }
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
hkdf = "0.12"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }
k256 = { version = "0.13", features = ["ecdsa", "schnorr"] }
sha3 = "0.12"
bincode = "1.3"
rpassword = "7"
portable-pty = "0.8"
strip-ansi-escapes = "0.2"
printpdf = "0.9"
pulldown-cmark = "0.12"
httpdate = "1.0"
dashmap = "5.5"
reqwest-eventsource = "0.6"
sysinfo = "0.39"
semver = "1"
hostname = { workspace = true }

# Certificate parsing
pem = "3.0"
x509-parser = "0.17"
include_dir = "0.7"
tokio-tungstenite = "0.26"
futures-util = "0.3"
clap = { version = "4.4", features = ["derive", "env"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.13"
if-addrs = "0.13"
tower = "0.5"
mime_guess = "2.0"
mdns-sd = { workspace = true }
rust-embed = { version = "8.0", features = ["compression"] }
teloxide = { version = "0.17", features = ["macros"] }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-native-tls", "builder", "smtp-transport"] }
mail-parser = "0.9"
async-imap = "0.10"
async-native-tls = "0.5"
cron = "0.13"
extism = "1.7"
inquire = "0.7"
loom = { version = "0.7", optional = true }
whatsapp-rust = { version = "0.5", default-features = false, features = ["tokio-runtime", "tokio-transport", "sqlite-storage"] }
whatsapp-rust-tokio-transport = "0.5"
matrix-sdk = { version = "0.16", default-features = false, features = ["native-tls", "sqlite"] }
mime = "0.3"
aleph-logging = { path = "shared/logging" }
aleph-desktop = { path = "desktop/shared" }
aleph-client = { path = "shared/client" }
open = "5.3.3"

[target.'cfg(target_os = "macos")'.dependencies]
aleph-desktop-macos = { path = "desktop/macos" }

[target.'cfg(target_os = "linux")'.dependencies]
aleph-desktop-linux = { path = "desktop/linux" }
# SP-2: Landlock LSM (FS ACL) — kernel ≥ 5.13. Single small crate, official-ish.
landlock = "0.4"
# SP-2: seccomp-bpf syscall denylist. AWS Firecracker's own filter library.
seccompiler = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
aleph-desktop-windows = { path = "desktop/windows" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",      # SP-6: AppContainer profile API (Create/Delete/DeriveSid)
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Memory",           # SP-3a (LocalFree) + SP-6 (HeapAlloc/HeapFree)
    "Win32_System_SystemServices",   # SP-6: PROC_THREAD_ATTRIBUTE_* constants
] }

