mime = "0.3"
aleph-logging = { path = "shared/logging" }
aleph-desktop = { path = "desktop/shared" }
aleph-client = { path = "shared/client" }
open = "5.3.3"

[target.'cfg(target_os = "macos")'.dependencies]
aleph-desktop-macos = { path = "desktop/macos" }

[target.'cfg(target_os = "linux")'.dependencies]
aleph-desktop-linux = { path = "desktop/linux" }

[target.'cfg(target_os = "windows")'.dependencies]
aleph-desktop-windows = { path = "desktop/windows" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
] }

[build-dependencies]
# No build dependencies - using Gateway WebSocket architecture

[[bin]]
name = "aleph-server"
path = "src/bin/aleph-server/main.rs"

[dev-dependencies]
