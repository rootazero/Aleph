# Aleph Workspace Configuration
# This workspace manages the shared Rust core library for cross-platform builds

[workspace]
resolver = "2"
members = [
    "desktop/shared",
    "desktop/macos",
    "desktop/linux",
    "desktop/windows",
    "shared/logging",
    "shared/protocol",
    "shared/ui_logic",

    "shared/client",

    "interfaces/cli",
    "interfaces/tui",
    "interfaces/webchat",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rootazero/Aleph"
rust-version = "1.92"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "sync", "time", "macros", "process", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
thiserror = "2.0"

# Database
rusqlite = { version = "0.37", features = ["bundled"] }

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
regex = "1.10"
chrono = "0.4"
dirs = "6.0"
once_cell = "1.19"

# HTTP
reqwest = { version = "0.11", features = ["json", "native-tls", "stream", "multipart"] }

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# File watching
notify = { version = "6.1", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = "0.3"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff"] }
base64 = "0.22"

# Async utilities
async-trait = "0.1"
futures = "0.3"

# Archive handling
zip = "2.2"
flate2 = "1.0"
tar = "0.4"

# Git operations
git2 = "0.19"
glob = "0.3"

# System info
hostname = "0.4"
whoami = "1.5"

# Schema generation
schemars = "0.8"

# Web scraping
scraper = "0.22"
url = "2.5"

# Caching
lru = "0.12"

# mDNS service discovery
mdns-sd = "0.11"

# UniFFI removed - using Gateway WebSocket architecture

# ===== Package (alephcore) =====

[package]
name = "alephcore"
version = "0.2.5"
edition = "2021"
rust-version = "1.92"

[lib]
crate-type = ["rlib", "cdylib"]
name = "alephcore"

[features]
default = []
# Loom concurrency testing (replaces std sync primitives)
loom = ["dep:loom"]
# Test helpers for integration tests
test-helpers = []
# Control plane UI (Leptos/WASM dashboard)
control-plane = []
# Disabled test modules awaiting rewrite
disabled-tests = []
# Experimental Telegram Draft API support
telegram-draft-api = []
[dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "sync", "time", "macros", "process", "fs", "io-util", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt", "compat"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
aleph-protocol = { path = "shared/protocol" }
rusqlite = { version = "0.37", features = ["bundled"] }
sqlite-vec = "0.1.9"
uuid = { version = "1.7", features = ["v4", "serde"] }
regex = "1.10"
aho-corasick = "1.1"
percent-encoding = "2.3"
chrono = { version = "0.4", features = ["serde"] }
