# Release profile
[profile.release]
strip = true

# Panel-only release profile: keep the wasm `name` section so browser stack
# traces carry Rust symbol names. `strip` is a final-artifact setting and
# cannot be overridden per-package, so the panel build uses this profile while
# the `aleph-server` binary keeps `strip = true`. See
# docs/superpowers/specs/2026-06-09-panel-crash-diagnostics-design.md.
[profile.wasm-release]
inherits = "release"
strip = false
# Size-first codegen: the panel is a browser download, so binary size beats
# the marginal runtime gain of opt-level 3 here.
opt-level = "z"
lto = true
codegen-units = 1

# Patch matrix-sdk with a fork of matrix-sdk-0.16.0 that adds
# #![recursion_limit = "512"] to crates/matrix-sdk/src/lib.rs.
# The default 128 overflows when async fn body of Client::sync() is
# monomorphized in CI Linux release builds (+130 observed). Setting
# recursion_limit on the consumer crate (alephcore) does NOT propagate
# to matrix-sdk's compilation — the compiler hint explicitly asks for
# the attribute on `matrix_sdk` itself — so we vendor the fix via patch.
[patch.crates-io]
matrix-sdk = { git = "https://github.com/rootazero/matrix-rust-sdk", branch = "aleph-0.16.0-recursion-fix" }
